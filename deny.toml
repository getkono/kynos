# What `mise run deny:check` holds the dependency graph to; anything absent is
# cargo-deny's default (https://embarkstudios.github.io/cargo-deny/checks/cfg.html).

[graph]
# Optional dependencies are reachable only with every feature on. No `targets`:
# a dependency reached on any platform is one somebody ships.
all-features = true

[advisories]
# Each ignored advisory needs a `reason`: why it does not reach Kynos and what
# clears it.
ignore = [
  { id = "RUSTSEC-2026-0009", reason = "time's RFC 2822 parser; reached only through rcgen, a dev-dependency minting the TLS example's certificates, which parses no RFC 2822 input. The fix, time 0.3.47, needs Rust 1.88 and the lockfile resolves at the 1.85 MSRV. Remove when the MSRV reaches 1.88 or rcgen leaves the graph." },
]
# The default only warns about a withdrawn version, and nothing reads warnings.
yanked = "deny"

[licenses]
# Permissive licences only, so an MIT application can meet every term. Adding
# one is a policy change.
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "ISC",
  "MIT",
  "MIT-0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.8

[bans]
# Warn: duplicates come from upstream crates disagreeing, which no change here
# can resolve.
multiple-versions = "warn"
# A `*` accepts any future major. Path dependencies between members are exempt.
wildcards = "deny"
allow-wildcard-paths = true

[sources]
# crates.io only, since nothing else can be published there.
unknown-registry = "deny"
unknown-git = "deny"
