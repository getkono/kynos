# Debug information dominates a dev build here: each statically linked test or
# example binary carries its own DWARF copy (15.06 GiB at cargo's default).
# `line-tables-only` keeps file and line in a panic backtrace for this
# workspace; dependencies get none. Override per run with
# `CARGO_PROFILE_DEV_DEBUG=2` (workspace crates) or
# `cargo --config 'profile.dev.package."*".debug=2' test` (dependencies).
#
# Measured on `cargo build --workspace --all-targets --all-features`:
#
#   debug = 2 (cargo's default)                15.06 GiB
#   split-debuginfo = "unpacked"                8.20 GiB
#   dependencies only, debug = false            8.53 GiB
#   line-tables-only, everything                6.68 GiB
#   this profile                                4.73 GiB
#   debug = 0, everything (the floor)           3.73 GiB
#
# Here rather than in `Cargo.toml` so it also reaches the standalone workspaces
# `trybuild` and `cargo llvm-cov` generate under `target/`. `[profile.bench]`
# inherits from `release`, not from this.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
