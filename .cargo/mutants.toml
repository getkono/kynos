# cargo-mutants configuration; `docs/testing.md#mutation-testing` gives the
# reason for each setting and how to triage a survivor.

# `hermeticity.rs` fails under `cargo test` by design.
test_tool = "nextest"

# A mutant in code the build does not compile is reported missed.
# `cfg(not(feature = ...))` arms are left to `mise run test:baseline`.
all_features = true

# Much of `kynos-openapi` and `kynos-macros` is witnessed only from `kynos`.
test_package = ["kynos-openapi", "kynos-macros", "kynos"]

# Seconds. The baseline that sets the timeout runs only the mutated crate's
# tests, not `test_package`'s, so it would set one far too short.
minimum_test_timeout = 600

# Tests whose verdict on a mutant would be wrong; `mise run test` keeps them.
#
# - `_diagnostic_has_a_case` and the seven named tests count tokens inside
#   function bodies they `include_str!`, so any body mutant changes the count.
# - `binary(/^alloc/)` would fail a mutant for its allocations, not behaviour.
# - `binary(determinism)` catches an unordered walk only by the luck of seeds.
# - `binary(ui)` rebuilds every compile-fail fixture per mutant; a survivor that
#   removes a compile-time refusal is checked with `mise run ui:check`.
#
# `--fail-fast`: one failing test is the whole verdict.
additional_cargo_test_args = [
  "--fail-fast",
  "-E",
  """not (\
    binary(/^alloc/) | binary(=determinism) | binary(=ui) \
    | (package(kynos-macros) & test(/_diagnostic_has_a_case$/)) \
    | (package(kynos-openapi) & (\
        test(=annotation::tests::every_reason_carries_the_token_the_record_spells) \
      | test(=emit::tests::blockers::every_three_two_field_is_reported) \
      | test(=emit::tests::blockers::every_construct_has_a_case)\
    )) \
    | (package(kynos) & (\
        test(=security::carrier::parse::tests::every_refusal_has_a_case) \
      | test(=security::carrier::base64::tests::every_refusal_has_a_case) \
      | test(=server::tests::protocol_configuration::every_refusal_has_a_case) \
      | test(=extract::body::json_lines::tests::every_streamed_rejection_has_a_case)\
    ))\
  )""",
]

exclude_globs = [
  # Unpublished measurement harness; nothing depends on it.
  "crates/kynos-profile/**",
  # Per-platform `cfg` arms that only forward to tokio's signal streams.
  "crates/kynos/src/server/shutdown/signal.rs",
  # Proc-macro entry points that only forward to a mutated `expand`; a mutant
  # here is unviable. One that does more belongs in the module it forwards to.
  "crates/kynos-macros/src/lib.rs",
  # `cfg(fuzzing)`, so never compiled by a test build; forwards to a mutated parser.
  "crates/kynos/src/__private/fuzz.rs",
]

exclude_re = [
  # Hand-written `Debug` impls: a mutant only ever prints less, leaking nothing.
  '<impl (std::)?fmt::Debug for .*>::fmt ',
]
