[workspace]
members = [
  "crates/kynos",
  "crates/kynos-macros",
  "crates/kynos-openapi",
  "crates/kynos-profile",
]
exclude = ["references"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/getkono/kynos"
publish = true

[workspace.dependencies]
kynos-macros = { version = "0.3.0", path = "crates/kynos-macros" }
kynos-openapi = { version = "0.3.0", path = "crates/kynos-openapi", default-features = false }

# Why this counter, and why one at all, is `docs/architecture.md`'s
# (Dependencies). `macros` is off because the attribute form is unused; `std`
# carries `AllocCounterSystem`, and `pin-utils` rides along for an async helper
# this tree does not call.
alloc_counter = { version = "0.0.4", default-features = false, features = ["std"] }
async-compression = "0.4.19"
bigdecimal = { version = "0.4.10", default-features = false }
bytes = "1.10.1"
chrono = { version = "0.4.45", default-features = false }
futures-core = "0.3.31"
# The instruction-count kind in `docs/performance.md`: Callgrind and DHAT over a
# library benchmark, driven by a runner binary whose version must match this
# one exactly. Named only by `crates/kynos-profile`, which is unpublished, so it
# never reaches a package anyone installs.
gungraun = "=0.20.0"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = "1.7.0"
hyper-util = "0.1.16"
indexmap = "2.11.0"
jiff = { version = "0.2.35", default-features = false }
# `kynos::test`'s conformance assertions validate an observed body against the
# schema the description declares, which needs a JSON Schema *instance*
# validator. Its defaults are `resolve-http`, `resolve-file` and
# `tls-aws-lc-rs` -- a reqwest and rustls stack whose whole job is fetching a
# `$ref` over the network. A description is self-contained, so all three are
# off: a test that reached the network to decide whether a response conformed
# would not be hermetic.
jsonschema = { version = "0.49.9", default-features = false }
# The `jwt` example verifies a real token, and Kynos ships no JWT verifier on
# purpose: the algorithm, the claim set and the key rotation are the
# application's, and there is no one-size-fits-all. So it is a dev-dependency,
# named by one example and by nothing under `src/`. `default-features = false`
# drops `use_pem`, since the example signs with HMAC.
jsonwebtoken = { version = "9.3.1", default-features = false }
listenfd = "1.0.2"
matchit = "0.9.2"
# The rate-limit example needs a real cache to be a reference implementation of
# `RateLimitStore`. A counter store is a dependency, so the framework ships the
# seam and the example ships the store; `moka` is named by one example and by
# nothing under `src/`.
moka = { version = "0.12.10", default-features = false, features = ["future"] }
multer = "3.1.0"
# `#[cfg_attr(test, mutants::skip)]`, for a function cargo-mutants should not
# mutate and whose reason fits no `exclude_re` in `.cargo/mutants.toml`. Only a
# dev-dependency, and of a member only once that member writes the attribute:
# under `cfg(test)` the path has to resolve, and outside it the attribute is
# gone, so nothing it names reaches a published build.
mutants = "0.0.4"
percent-encoding = "2.3.2"
prost = "0.14.4"
rcgen = "0.14.9"
proc-macro2 = "1.0.101"
proptest = "1.11.0"
quote = "1.0.40"
rust_decimal = { version = "1.42.1", default-features = false }
# The hostile graph `server/tls/` exists to survive, declared so the suite runs
# under it. Nothing in `src/` names it -- it reaches the library through
# `tokio-rustls` -- but a dev-dependency asking the same `rustls` for `ring`
# unifies the two provider features onto one copy, which is the state that made
# the implicit constructors panic. `default-features = false` so the feature
# list is only what the graph is being put into.
rustls = { version = "0.23.43", default-features = false }
serde = "1.0.219"
# `serde_urlencoded`'s fork that reads a repeated key as a sequence, which is
# what the `form` style with `explode` describes for an array property.
serde_html_form = "0.4.1"
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
# Accepted-socket options tokio's `TcpStream` does not expose: TCP keepalive
# with an idle time. Already in the graph through tokio's `net`, at this major
# version and with `all`, so declaring it adds no crate and no feature. `all` is
# what lets `server/tests.rs` read the idle time and interval back.
socket2 = { version = "0.6.5", features = ["all"] }
syn = "2.0.106"
thiserror = "2.0.19"
tokio = "1.53.1"
# `server/tls/` names the crypto provider rather than letting rustls resolve one
# from crate features, so the provider it names has to be compiled in rather
# than inherited: the defaults are `logging`, `tls12` and `aws_lc_rs`, and
# leaving them on would mean the right provider is present only for as long as
# nobody else in the graph enables `ring` as well. `tls12` and `logging` are the
# other two defaults, kept because dropping either is a behaviour change this
# declaration is not making.
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "aws-lc-rs",
  "logging",
  "tls12",
] }
tower = "0.5.2"
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
# OpenTelemetry reaches Kynos only through the `Observer`/`Interceptor` seams,
# so none of these is a dependency of the framework -- they exist for the
# example that shows the wiring. See `crates/kynos/examples/opentelemetry.rs`.
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = "0.32.0"
opentelemetry-semantic-conventions = "0.32.1"
tracing-opentelemetry = "0.33.0"
trybuild = "1.0.111"
# A scalar-format crate is reached only from `schema/impls/`, and is declared
# without default features because only the type is wanted -- an application
# brings its own copy with whatever else it needs from it.
uuid = { version = "1.24.0", default-features = false }

# Lints are declared once here and inherited by every member with
# `[lints] workspace = true`. Kynos is a public framework: undocumented public
# API and unsafe code are hard errors, not warnings.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `fuzzing` is the cfg `cargo fuzz` sets, and `kynos::__private::fuzz` is gated
# on it. Declared so every other build reads it as known rather than misspelled.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Rustdoc conventions we deliberately do not follow: error and panic conditions
# are documented where they are non-obvious, not mechanically on every item.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `kynos::error::Error` and friends read better than `kynos::error::KynosError`.
module_name_repetitions = "allow"
# `needless_pass_by_value`, `unused_self` and `must_use_candidate` are not
# allowed here: what each site should be is argued at the site. Where a
# signature is by value on purpose -- a `map_err`
# argument, a builder that reads better owning what it is handed, an iterator
# the search has to clone -- there is an `#[allow]` with the reason beside it,
# which is a claim a reviewer can disagree with. A blanket allow was not.

# `panic` is deliberately pinned to `unwind`: a statically selected recovery
# policy turns a handler panic into a declared 500, which `panic = "abort"`
# would make impossible.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

# Timed benchmarks live in getkono/kynos-bench. This profile keeps debug info
# while staying optimized, which is what local profiling needs and what
# `crates/kynos-profile`'s counted benchmark is built with, so every frame in
# its Callgrind output is named.
[profile.bench]
debug = true
lto = "thin"
