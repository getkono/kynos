[workspace]
members = ["crates/kynos", "crates/kynos-macros", "crates/kynos-openapi"]
exclude = ["references"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/getkono/kynos"
publish = true

[workspace.dependencies]
kynos-macros = { version = "0.1.0", path = "crates/kynos-macros" }
kynos-openapi = { version = "0.1.0", path = "crates/kynos-openapi", default-features = false }

# The allocation-count kind in `docs/performance.md` needs a global allocator
# that reports what a region allocated, and `unsafe_code = "forbid"` below means
# no crate here can write one: `forbid` is not liftable by an `#[allow]`, so the
# `unsafe impl GlobalAlloc` a counter requires cannot compile in any crate that
# inherits these lints, which is all three of them.
# `alloc_counter` is the counter with the two properties that measurement needs.
# Its counters are thread-local, so a region reads what the measuring thread
# allocated rather than what the process did -- `libtest` always has a second
# thread alive beside the one running a test, and a process-global counter
# reports its work as the router's. And it installs nothing on its own behalf:
# the one target that wants it declares `#[global_allocator]` itself, which is
# what keeps the instrument out of every other test binary in the package.
# `macros` is off because the attribute form is unused; `std` carries
# `AllocCounterSystem`, and `pin-utils` rides along for an async helper this
# tree does not call.
# It is `0.0.4` and was last published in 2019, which is the trade taken
# knowingly: it is a dev-dependency of one test target and the surface used is
# one function.
# `stats_alloc` was this dependency and counts into process globals, which is
# the flake it caused. `allocation-counter` counts per thread but declares
# `#[global_allocator]` inside the library, which would install the instrument
# in every test binary in the package rather than in the one that asked. `dhat`
# is a profiler rather than a counter: it captures a backtrace per allocation
# and carries six crates this tree does not otherwise have.
alloc_counter = { version = "0.0.4", default-features = false, features = ["std"] }
async-compression = "0.4.19"
bigdecimal = { version = "0.4.10", default-features = false }
bytes = "1.10.1"
chrono = { version = "0.4.45", default-features = false }
futures-core = "0.3.31"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = "1.7.0"
hyper-util = "0.1.16"
indexmap = "2.11.0"
jiff = { version = "0.2.35", default-features = false }
# `kynos::test`'s conformance assertions validate an observed body against the
# schema the description declares, which needs a JSON Schema *instance*
# validator. Its defaults are `resolve-http`, `resolve-file` and
# `tls-aws-lc-rs` -- a reqwest and rustls stack whose whole job is fetching a
# `$ref` over the network. A description is self-contained, so all three are
# off: a test that reached the network to decide whether a response conformed
# would not be hermetic.
jsonschema = { version = "0.49.9", default-features = false }
# The `jwt` example verifies a real token, and Kynos ships no JWT verifier on
# purpose: the algorithm, the claim set and the key rotation are the
# application's, and there is no one-size-fits-all. So it is a dev-dependency,
# named by one example and by nothing under `src/`. `default-features = false`
# drops `use_pem`, since the example signs with HMAC.
jsonwebtoken = { version = "9.3.1", default-features = false }
listenfd = "1.0.2"
matchit = "0.9.2"
# The rate-limit example needs a real cache to be a reference implementation of
# `RateLimitStore`. A counter store is a dependency, so the framework ships the
# seam and the example ships the store; `moka` is named by one example and by
# nothing under `src/`.
moka = { version = "0.12.10", default-features = false, features = ["future"] }
multer = "3.1.0"
percent-encoding = "2.3.2"
prost = "0.14.4"
rcgen = "0.14.9"
proc-macro2 = "1.0.101"
proptest = "1.11.0"
quote = "1.0.40"
rust_decimal = { version = "1.42.1", default-features = false }
serde = "1.0.219"
serde_json = "1.0.145"
serde_urlencoded = "0.7.1"
serde_yaml_ng = "0.10.0"
syn = "2.0.106"
thiserror = "2.0.19"
tokio = "1.53.1"
tokio-rustls = "0.26.4"
tower = "0.5.2"
tower-service = "0.3.3"
tracing = "0.1.41"
tracing-subscriber = "0.3.20"
# OpenTelemetry reaches Kynos only through the `Observer`/`Interceptor` seams,
# so none of these is a dependency of the framework -- they exist for the
# example that shows the wiring. See `crates/kynos/examples/opentelemetry.rs`.
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = "0.32.0"
opentelemetry-semantic-conventions = "0.32.1"
tracing-opentelemetry = "0.33.0"
trybuild = "1.0.111"
# A scalar-format crate is reached only from `schema/impls/`, and is declared
# without default features because only the type is wanted -- an application
# brings its own copy with whatever else it needs from it.
uuid = { version = "1.24.0", default-features = false }

# Lints are declared once here and inherited by every member with
# `[lints] workspace = true`. Kynos is a public framework: undocumented public
# API and unsafe code are hard errors, not warnings.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Rustdoc conventions we deliberately do not follow: error and panic conditions
# are documented where they are non-obvious, not mechanically on every item.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
# `kynos::error::Error` and friends read better than `kynos::error::KynosError`.
module_name_repetitions = "allow"
# `needless_pass_by_value`, `unused_self` and `must_use_candidate` were allowed
# here while the surface was `todo!()`-bodied and Clippy could not see how
# arguments and receivers were consumed. The bodies landed, the cleanup was
# taken, and the three allows are gone: what each site should be is now argued
# at the site. Where a signature is by value on purpose -- a `map_err`
# argument, a builder that reads better owning what it is handed, an iterator
# the search has to clone -- there is an `#[allow]` with the reason beside it,
# which is a claim a reviewer can disagree with. A blanket allow was not.

# `panic` is deliberately pinned to `unwind`: a statically selected recovery
# policy turns a handler panic into a declared 500, which `panic = "abort"`
# would make impossible.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

# Benchmarks live in getkono/kynos-bench, but a profile that keeps debug info
# while staying optimized makes local profiling of this workspace possible.
[profile.bench]
debug = true
lto = "thin"
