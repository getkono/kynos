[workspace]
members = [
  "crates/kynos",
  "crates/kynos-macros",
  "crates/kynos-openapi",
  "crates/kynos-profile",
]
exclude = ["references"]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/getkono/kynos"
publish = true

[workspace.dependencies]
kynos-macros = { version = "0.3.0", path = "crates/kynos-macros" }
kynos-openapi = { version = "0.3.0", path = "crates/kynos-openapi", default-features = false }

# See `docs/architecture.md` (Dependencies). `std` carries `AllocCounterSystem`.
alloc_counter = { version = "0.0.4", default-features = false, features = ["std"] }
async-compression = "0.4.19"
bigdecimal = { version = "0.4.10", default-features = false }
bytes = "1.10.1"
chrono = { version = "0.4.45", default-features = false }
futures-core = "0.3.31"
# Must equal the `gungraun` runner pinned in `mise.toml`.
gungraun = "=0.20.0"
http = "1.3.1"
http-body = "1.0.1"
http-body-util = "0.1.3"
hyper = "1.7.0"
hyper-util = "0.1.16"
indexmap = "2.11.0"
jiff = { version = "0.2.35", default-features = false }
# No defaults: they fetch `$ref`s over the network, and a description is
# self-contained, so conformance checks stay hermetic.
jsonschema = { version = "0.49.9", default-features = false }
# The `jwt` example only; Kynos ships no JWT verifier.
jsonwebtoken = { version = "9.3.1", default-features = false }
listenfd = "1.0.2"
matchit = "0.9.2"
# The rate-limit example's `RateLimitStore` only; Kynos ships the seam.
moka = { version = "0.12.10", default-features = false, features = ["future"] }
multer = "3.1.0"
# For `#[cfg_attr(test, mutants::skip)]`; a dev-dependency only.
mutants = "0.0.4"
percent-encoding = "2.3.2"
prost = "0.14.4"
rcgen = "0.14.9"
proc-macro2 = "1.0.101"
proptest = "1.11.0"
quote = "1.0.40"
# Linear-time matching. The derive and the run time share these features, so a
# pattern the expansion accepts is one the run time accepts.
regex = "1.13.1"
regex-syntax = "0.8.11"
rust_decimal = { version = "1.42.1", default-features = false }
# A safe `setrlimit` for a test; `unsafe_code` is forbidden, so not `libc`.
rustix = { version = "1.1.4", default-features = false }
# A test-only dependency that unifies `ring` beside `aws-lc-rs`, the graph
# `server/tls/` must survive.
rustls = { version = "0.23.43", default-features = false }
serde = "1.0.221"
# Reads a repeated key as a sequence, as `form` with `explode` describes.
serde_html_form = "0.4.1"
serde_json = "1.0.145"
serde_yaml_ng = "0.10.0"
# TCP keepalive with an idle time, which tokio does not expose. Already in the
# graph through tokio's `net`, with `all`.
socket2 = { version = "0.6.5", features = ["all"] }
syn = "2.0.106"
thiserror = "2.0.19"
tokio = "1.53.1"
# The defaults, stated: `server/tls/` names `aws-lc-rs` explicitly, so it must
# be compiled in rather than left to feature unification.
tokio-rustls = { version = "0.26.4", default-features = false, features = [
  "aws-lc-rs",
  "logging",
  "tls12",
] }
tower = "0.5.2"
tower-layer = "0.3.3"
tower-service = "0.3.3"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
# `examples/opentelemetry.rs` only; Kynos exposes the seams.
opentelemetry = "0.32.0"
opentelemetry_sdk = "0.32.1"
opentelemetry-otlp = "0.32.0"
opentelemetry-semantic-conventions = "0.32.1"
tracing-opentelemetry = "0.33.0"
trybuild = "1.0.111"
# Scalar-format crates are declared without defaults: only the type is wanted.
uuid = { version = "1.24.0", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
# `cargo fuzz` sets `fuzzing`, which gates `kynos::__private::fuzz`.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(fuzzing)"] }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Errors and panics are documented where non-obvious, not on every item.
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"

# Panic recovery turns a handler panic into a declared 500; `abort` cannot.
[profile.release]
lto = "fat"
codegen-units = 1
panic = "unwind"

# Optimized with debug info, so `kynos-profile`'s Callgrind frames are named.
[profile.bench]
debug = true
lto = "thin"
