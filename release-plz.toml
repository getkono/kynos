# Release-plz owns the release. It reads the Conventional Commits since the last
# tag, computes the next version, rewrites the changelogs, opens the release
# pull request, and -- when that pull request merges -- publishes to crates.io,
# tags, and cuts the GitHub release. `.github/workflows/release-plz.yml` runs
# it. The human half, including the one-time setup that cannot be committed, is
# `docs/releasing.md`.
#
# The three crates move together. Every member sets `version.workspace = true`,
# and release-plz answers that by giving all of them the highest next version it
# computed for any one of them. That is what this workspace wants: `kynos`
# re-exports the other two, so a `kynos` that pinned an older `kynos-openapi`
# would re-export a document model it does not ship.
#
# Publish order is not configured here and must not be. Release-plz
# topologically sorts the publishable packages by their dependency edges and
# waits for each to appear in the index before starting the next, so
# `kynos-openapi` -> `kynos-macros` -> `kynos` falls out of the graph.

[workspace]
# `cargo publish` runs. This file used to say `git_only = true`, whose
# documented effect is that "the package will not be published to any cargo
# registry (`cargo publish` is skipped)". Tagging and the GitHub release would
# still have happened; publishing never would, which is why none of the three
# names exists on crates.io. `git_only` and `publish` cannot both be true, so it
# is deleted rather than contradicted. This is the default, stated because
# removing the field it contradicts is the point of the line.
publish = true

# Release when the release pull request merges, not on every push to master.
# The default publishes a package the moment its commit lands, which would make
# the release pull request -- and the changelog a human reads before merging it
# -- ceremony. Release-plz recognises the merge by the `release-plz-` branch
# prefix, so a hand-made pull request that should trigger a release must use
# that prefix too.
release_always = false

# `cargo publish` verifies by building the tarball it just wrote, and by default
# it builds only the default feature set. Kynos gates roughly thirty features,
# so a default-features verify compiles a fraction of `src/` and proves almost
# nothing about the archive's completeness: a file reachable only under `tls` or
# `assets` could be missing and the publish would still succeed. `lint`, `test`,
# `test:doc` and `docs:check` all pass `--all-features` for exactly this reason.
#
# Not `publish_features = ["full"]`: `full` deliberately excludes `unchecked`
# and `assets-fs`, whose modules are public API and must be in the archive.
#
# `mise run publish:check` runs the same verification on every push, so this is
# the second of two identical gates rather than the only one.
publish_all_features = true

# cargo-semver-checks on every release. Kynos is pre-1.0, so an incompatible
# change is a minor bump rather than a refusal, but the verdict and the list of
# broken items land in the release pull request body -- which is the evidence a
# reviewer needs to decide whether the break was the one that was intended. The
# release-plz action installs cargo-semver-checks itself, so no mise task does.
#
# This is the default; it is stated because the two limits below make it worth
# less than the name suggests, and a reader should meet them here.
#
# Two limits, recorded because `docs/nfr.md` must not claim more than this buys.
# Release-plz invokes it with no feature flags, so only the default feature set
# is compared; and it reports "compatible" for any failure whose output does not
# say a new major version is required, so a toolchain problem is
# indistinguishable from a clean run. It is also inert until 0.1.0 exists on
# crates.io to compare against.
semver_check = true

# Only the workspace's own packages are re-pinned in `Cargo.lock`, which is the
# default, stated for the record: a release pull request that also bumped every
# transitive dependency would mix "publish the code that was reviewed" with
# "take whatever upstream shipped this week". The second is Dependabot's job,
# and it already has it.
dependencies_update = false

# The one pull request nobody authored. The label is what makes it filterable,
# and what says on the tin that merging it publishes to crates.io.
pr_labels = ["release"]

# Tag all three. Release-plz decides "already released" by looking for the tag,
# and generates each changelog from the commits since the tag before it, so a
# missing tag would replay the entire history into the next release's notes.
#
# Announce one. The three versions are always equal and cut from one commit, so
# three GitHub releases would be three copies of one announcement. Each crate
# still keeps its own `CHANGELOG.md`, which ships inside its own `.crate` --
# crates.io renders only the README, but the file is in the archive a vendoring
# consumer unpacks, and `kynos-openapi`'s has an audience of its own because
# that crate is usable without the runtime.

[[package]]
name = "kynos"
changelog_path = "crates/kynos/CHANGELOG.md"
git_tag_name = "kynos-v{{ version }}"
git_release_enable = true
git_release_name = "Kynos v{{ version }}"

[[package]]
name = "kynos-macros"
changelog_path = "crates/kynos-macros/CHANGELOG.md"
git_tag_name = "kynos-macros-v{{ version }}"
git_release_enable = false

[[package]]
name = "kynos-openapi"
changelog_path = "crates/kynos-openapi/CHANGELOG.md"
git_tag_name = "kynos-openapi-v{{ version }}"
git_release_enable = false
