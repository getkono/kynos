# The process and its human half are `docs/releasing.md`. The three crates share
# one version, and publish order falls out of the dependency graph.

[workspace]
publish = true

# Release when the release pull request merges, so its changelog is reviewed.
release_always = false

# Verify the tarball at every feature, not only the default set (not `full`,
# which leaves out public `unchecked` and `assets-fs`).
publish_all_features = true

# Default features only, and fail-open; `mise run semver:check` covers the rest.
semver_check = true

# Re-pin only the workspace's own packages; upstream bumps are Dependabot's.
dependencies_update = false

pr_labels = ["release"]

# Tag all three, since each changelog starts at its crate's previous tag;
# announce one, since the versions are always equal.

[[package]]
name = "kynos"
changelog_path = "crates/kynos/CHANGELOG.md"
git_tag_name = "kynos-v{{ version }}"
git_release_enable = true
git_release_name = "Kynos v{{ version }}"

[[package]]
name = "kynos-macros"
changelog_path = "crates/kynos-macros/CHANGELOG.md"
git_tag_name = "kynos-macros-v{{ version }}"
git_release_enable = false

[[package]]
name = "kynos-openapi"
changelog_path = "crates/kynos-openapi/CHANGELOG.md"
git_tag_name = "kynos-openapi-v{{ version }}"
git_release_enable = false

# `docs` is shown: rustdoc is the contract surface, so a change to it is
# user-visible.

[changelog]
# A backstop: no skip rule, including a later one, may hide a breaking commit.
protect_breaking_commits = true

commit_parsers = [
  # A merge names a branch; its commits already describe the change.
  { message = "^Merge ", skip = true },
  { message = "^chore\\(release\\)", skip = true },

  { message = "^feat", group = "Added" },
  { message = "^fix", group = "Fixed" },
  { message = "^revert", group = "Fixed" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },

  # Breaking commits of a skipped type. After the groups above, so `feat!` and
  # `fix!` keep theirs; before the skips, since git-cliff stops at the first match.
  { message = "^[a-z]+(\\(.*\\))?!", group = "Other" },

  # Not observable from outside the crate.
  { message = "^refactor", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = "^build", skip = true },
  { message = "^ci", skip = true },
  { message = "^chore", skip = true },

  # A type no rule above names is surfaced, not dropped.
  { message = "^.*", group = "Other" },
]
