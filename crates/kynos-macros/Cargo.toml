[package]
name = "kynos-macros"
description = "Procedural macros for the Kynos REST API framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Its own README, which says to depend on `kynos` instead.
readme = "README.md"
keywords = ["kynos", "openapi", "macros", "proc-macro", "rest"]
categories = ["web-programming", "development-tools"]

[lib]
proc-macro = true

[features]
default = ["openapi31"]
# `assets!`, which walks a directory at expansion time.
assets = []
openapi31 = ["kynos-openapi/openapi31"]
openapi32 = ["openapi31", "kynos-openapi/openapi32"]
# `#[schema(pattern = "...")]`, refused without it rather than left unchecked.
pattern = ["dep:regex", "dep:regex-syntax"]

[dependencies]
# Shares the document model's path-template parser, so the two cannot disagree.
kynos-openapi = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
regex = { workspace = true, optional = true }
regex-syntax = { workspace = true, optional = true }
syn = { workspace = true, features = ["full", "extra-traits", "parsing"] }

[lints]
workspace = true

# As in `crates/kynos/Cargo.toml`.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
