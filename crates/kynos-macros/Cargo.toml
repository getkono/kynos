[package]
name = "kynos-macros"
description = "Procedural macros for the Kynos REST API framework."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# See the note in `crates/kynos/Cargo.toml`: a crate's own README, not a link to
# the workspace one, because crates.io resolves relative links against the
# package's directory in the repository. This one's whole job is to say "depend
# on `kynos` instead", which is worth rendering.
readme = "README.md"
keywords = ["kynos", "openapi", "macros", "proc-macro", "rest"]
categories = ["web-programming", "development-tools"]

[lib]
proc-macro = true

[features]
default = ["openapi31"]
# The `assets!` macro walks a directory at expansion time. Gated because a crate
# that never embeds files should not pay for the walk, and because `kynos` gates
# the surface it expands into.
assets = []
openapi31 = ["kynos-openapi/openapi31"]
openapi32 = ["openapi31", "kynos-openapi/openapi32"]

[dependencies]
# The path-template parser is shared with the document model rather than
# reimplemented: two notions of "valid path template" that could disagree is
# exactly the drift this framework exists to prevent.
kynos-openapi = { workspace = true }
proc-macro2 = { workspace = true }
quote = { workspace = true }
syn = { workspace = true, features = ["full", "extra-traits", "parsing"] }

[lints]
workspace = true
