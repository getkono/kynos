[package]
name = "kynos"
description = "An idiomatic, performance-focused REST API framework with OpenAPI 3.1 and 3.2 support."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[test]]
name = "ui"
path = "tests/ui.rs"

[[test]]
name = "panic-recovery-check"
path = "tests/compile/panic_recovery.rs"
harness = false

[[example]]
name = "hello"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "errors"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "state"
required-features = ["openapi31", "macros", "server", "http1"]

[[example]]
name = "interceptor"
required-features = ["openapi31", "macros", "server", "http1"]

[[example]]
name = "security"
required-features = ["openapi31", "macros", "server", "http1"]

[[example]]
name = "http2"
required-features = ["openapi31", "server", "http2"]

[[example]]
name = "graceful_shutdown"
required-features = ["openapi31", "server", "http1"]

[features]
default = [
  "openapi31",
  "macros",
  "server",
  "http1",
  "http2",
  "json",
  "trace",
]

# --- Specification version -------------------------------------------------
# `openapi31` is the baseline. `openapi32` is a strict superset: enabling it is
# purely additive for programs that use no 3.2-only construct.
openapi31 = ["kynos-openapi/openapi31"]
openapi32 = [
  "openapi31",
  "kynos-openapi/openapi32",
  "kynos-macros?/openapi32",
  # `response::stream` is the only thing that names a stream, and 3.1 has no
  # `itemSchema` to describe one with, so the whole subtree is 3.2-only.
  "dep:futures-core",
]

# --- Core ------------------------------------------------------------------
macros = ["dep:kynos-macros"]

# --- Runtime ---------------------------------------------------------------
server = [
  "dep:hyper-util",
  "dep:tracing",
  "tokio/net",
  "tokio/macros",
  "tokio/rt",
  "tokio/signal",
]
http1 = ["hyper/http1", "hyper-util?/http1"]
http2 = ["hyper/http2", "hyper-util?/http2"]
tls = ["server", "dep:tokio-rustls"]

# --- Codecs ----------------------------------------------------------------
# Application request and response payloads encoded as JSON. OpenAPI document
# serialization and RFC 9457 problem details remain available without it.
json = []
form = ["dep:serde_urlencoded"]
multipart = ["dep:multer"]
protobuf = ["dep:prost"]
cookie = ["dep:cookie"]
compression = ["dep:async-compression"]

# --- Scalar formats --------------------------------------------------------
# A type from outside `std` whose whole contribution is a JSON Schema `format`.
# Each is additive and off by default; the mapping is normative in
# `docs/schema.md`.
uuid = ["dep:uuid"]

# --- Observability ---------------------------------------------------------
# The `tracing` facade only. Choosing a subscriber stays the application's call.
trace = ["dep:tracing"]

# --- Document emission -----------------------------------------------------
yaml = ["kynos-openapi/yaml"]

# --- Testing ---------------------------------------------------------------
test-util = []

# --- Escape hatch ----------------------------------------------------------
# Unlocks `layer_unchecked`, `route_unchecked` and `upgrade_unchecked`. What
# they reach is recorded and flagged rather than dropped -- an operation stays
# in `paths` marked opaque, a route with no expressible template is listed at
# the document root -- and the document is stamped non-authoritative.
# Documented anti-pattern.
unchecked = ["dep:tower", "dep:tower-service"]

full = [
  "openapi32",
  "macros",
  "server",
  "http1",
  "http2",
  "json",
  "tls",
  "form",
  "multipart",
  "protobuf",
  "cookie",
  "compression",
  "trace",
  "yaml",
  "test-util",
  "uuid",
]

[dependencies]
kynos-macros = { workspace = true, optional = true }
kynos-openapi = { workspace = true }

async-compression = { workspace = true, optional = true, features = [
  "tokio",
  "gzip",
  "brotli",
  "zstd",
] }
bytes = { workspace = true }
cookie = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, optional = true, features = [
  "server",
  "tokio",
] }
multer = { workspace = true, optional = true }
percent-encoding = { workspace = true }
prost = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-rustls = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
hyper = { workspace = true, features = ["client", "http1", "http2"] }
# Applications derive serde alongside `kynos::Schema`, and the schema derive
# reads those attributes, so the tests have to be able to write them.
serde = { workspace = true, features = ["derive"] }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The UI suite hands `Router::intercept` a real `tower::Layer`, so the negative
# and its control differ only in whether the middleware declares itself.
tower = { workspace = true }
trybuild = { workspace = true }
# A scalar format claims a wire form, and the claim is only worth as much as a
# test that serializes the type and looks. That needs the serde integration the
# library itself does not.
uuid = { workspace = true, features = ["serde"] }

[lints]
workspace = true
