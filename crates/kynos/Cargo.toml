[package]
name = "kynos"
description = "An idiomatic, performance-focused REST API framework with OpenAPI 3.1 and 3.2 support."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# Not a symlink: crates.io resolves relative links against this directory.
# Named, so a deleted README is a manifest error.
readme = "README.md"
# No `swagger`: OpenAPI 3.0 and older are out of scope.
keywords = ["openapi", "rest", "api", "http", "framework"]
categories = [
  "web-programming::http-server",
  "network-programming",
  "asynchronous",
]

# Files whose oracle lives above this package (`references/`, `kynos-macros`,
# `scripts/`), so they would only fail from the tarball. The two tests are
# auto-discovered, since a declared target cannot have its path excluded.
exclude = [
  "cost/binary.tsv",
  "cost/codec.tsv",
  "cost/codegen.tsv",
  "tests/ledger.rs",
  "tests/metaschema.rs",
]

[[test]]
name = "ui"
path = "tests/ui.rs"

# Declared, or the `tests/assets/` fixture directory would be taken for a target.
[[test]]
name = "assets"
path = "tests/assets.rs"
required-features = ["openapi31", "macros", "assets"]

[[test]]
name = "panic-recovery-check"
path = "tests/compile/panic_recovery.rs"
harness = false

