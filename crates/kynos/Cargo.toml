[features]
default = [
  "openapi31",
  "macros",
  "server",
  "http1",
  "http2",
  "json",
  "trace",
]

# --- Specification version -------------------------------------------------
# `openapi32` is a strict superset of the `openapi31` baseline.
openapi31 = ["kynos-openapi/openapi31"]
openapi32 = [
  "openapi31",
  "kynos-openapi/openapi32",
  "kynos-macros?/openapi32",
  # Streams need 3.2's `itemSchema`.
  "dep:futures-core",
]

# --- Core ------------------------------------------------------------------
macros = ["dep:kynos-macros"]
# Enforces `#[schema(pattern = "...")]`, which the derive refuses without it.
pattern = ["macros", "kynos-macros/pattern", "dep:regex"]

# --- Runtime ---------------------------------------------------------------
server = [
  "dep:hyper-util",
  "dep:socket2",
  "dep:tracing",
  "tokio/net",
  "tokio/macros",
  "tokio/rt",
  "tokio/signal",
]
http1 = ["hyper/http1", "hyper-util?/http1"]
http2 = ["hyper/http2", "hyper-util?/http2"]
tls = ["server", "dep:tokio-rustls"]

# --- Codecs ----------------------------------------------------------------
# Application request and response payloads encoded as JSON. OpenAPI document
# serialization and RFC 9457 problem details remain available without it.
json = []
form = ["dep:serde_html_form"]
multipart = ["dep:multer"]
protobuf = ["dep:prost"]
# No `cookie` crate: it would put a foreign type in a public signature.
cookie = []
compression = ["dep:async-compression"]

# --- Scalar formats --------------------------------------------------------
# The mapping to JSON Schema `format` is normative in `docs/schema.md`.
uuid = ["dep:uuid"]

# Umbrellas holding the shapes their backends share; neither compiles alone.
# `time` is unrelated to the `time` crate.
time = []
time-chrono = ["time", "dep:chrono"]
time-jiff = ["time", "dep:jiff"]

decimal = []
decimal-rust = ["decimal", "dep:rust_decimal"]
decimal-big = ["decimal", "dep:bigdecimal"]

# --- Observability ---------------------------------------------------------
# The `tracing` facade only. Choosing a subscriber stays the application's call.
trace = ["dep:tracing"]

# --- Document emission -----------------------------------------------------
yaml = ["kynos-openapi/yaml"]

# --- Testing ---------------------------------------------------------------
test-util = ["dep:jsonschema"]

# --- Response cache --------------------------------------------------------
# `Cache` and `Conditional`; the store is the application's.
cache = []

# --- Static assets ---------------------------------------------------------
# `assets` embeds a directory as one described operation per file. `assets-fs`
# serves a directory no template can express, so it implies `unchecked`.
assets = ["kynos-macros?/assets"]
# `io-util` reads a range rather than the whole file.
assets-fs = ["assets", "unchecked", "tokio/fs", "tokio/io-util"]

# --- API reference ---------------------------------------------------------
# Mounts the reference page and the description as two described operations.
# Off by default: it adds two `paths` keys to the published contract.
docs = []

# --- Escape hatch ----------------------------------------------------------
# The `*_unchecked` methods. What they reach is recorded and the document is
# stamped non-authoritative. Documented anti-pattern.
unchecked = ["dep:tower-layer", "dep:tower-service"]

full = [
  "assets",
  "cache",
  "docs",
  "openapi32",
  "macros",
  "pattern",
  "server",
  "http1",
  "http2",
  "json",
  "tls",
  "form",
  "multipart",
  "protobuf",
  "cookie",
  "compression",
  "trace",
  "yaml",
  "test-util",
  "uuid",
  "time-chrono",
  "time-jiff",
  "decimal-rust",
  "decimal-big",
]

[dependencies]
kynos-macros = { workspace = true, optional = true }
kynos-openapi = { workspace = true, features = ["http"] }

async-compression = { workspace = true, optional = true, features = [
  "tokio",
  "gzip",
  "brotli",
  "zstd",
] }
bigdecimal = { workspace = true, optional = true }
bytes = { workspace = true }
chrono = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, optional = true, features = [
  "server",
  "tokio",
] }
jiff = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
matchit = { workspace = true }
multer = { workspace = true, optional = true }
percent-encoding = { workspace = true }
prost = { workspace = true, optional = true }
regex = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_html_form = { workspace = true, optional = true }
serde_json = { workspace = true }
socket2 = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-rustls = { workspace = true, optional = true }
tower-layer = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
# A dev-dependency adding a crate to the graph can reword the `ui` `.stderr`
# snapshots' "other types implement" lists; these add none.
futures-core = { workspace = true }
jsonwebtoken = { workspace = true }
moka = { workspace = true }
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
serde = { workspace = true, features = ["derive"] }
alloc_counter = { workspace = true }
# `test-util` pauses the clock for exact timeouts.
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "test-util"] }
tower = { workspace = true }
trybuild = { workspace = true }
bigdecimal = { workspace = true, features = ["serde"] }
# `clock` makes `Local` exist, so the UI case refusing `DateTime<Local>` fails
# for the right reason.
chrono = { workspace = true, features = ["alloc", "clock", "serde"] }
# The bundled zone database, so tests do not depend on the host's.
jiff = { workspace = true, features = [
  "std",
  "serde",
  "tzdb-bundle-always",
] }
rcgen = { workspace = true }
# Named by nothing: puts the suite under the graph with both rustls providers,
# which `server/tls/` must survive.
rustls = { workspace = true, features = ["ring", "std"] }
listenfd = { workspace = true }
rust_decimal = { workspace = true, features = ["serde"] }
# Examples install a subscriber and exporter; Kynos depends on neither.
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = { workspace = true }
tracing-opentelemetry = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

# `setrlimit` for `connection_adversarial.rs`.
[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true

# What `docs:check` builds. `docsrs` enables `feature(doc_cfg)` to badge gated
# items; not `doc_auto_cfg`, which rustc 1.92 removed.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
