[package]
name = "kynos"
description = "An idiomatic, performance-focused REST API framework with OpenAPI 3.1 and 3.2 support."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# crates.io renders this file as the crate page, and it is the only thing a
# reader sees before deciding to `cargo add`. It is its own file rather than a
# symlink to the repository README because crates.io resolves relative links
# against the package's path in the repository, so every `docs/...` link in the
# root README would resolve to `crates/kynos/docs/...` and 404. Naming it
# explicitly rather than relying on Cargo's auto-detection makes a deleted README
# a manifest error instead of a silently blank crate page.
readme = "README.md"
# Five is crates.io's limit on each. `swagger` is deliberately absent despite
# being the highest-traffic search term in this space: the README puts OpenAPI
# 3.0 and older permanently out of scope, so claiming it would be exactly the
# misdescription this framework exists to prevent.
keywords = ["openapi", "rest", "api", "http", "framework"]
categories = [
  "web-programming::http-server",
  "network-programming",
  "asynchronous",
]

# The two targets whose oracle is not in this package, and so cannot travel
# with it. `cargo package` copies a package directory and nothing above it:
# `metaschema.rs` reads the OAI's own schemas from `references/`, vendored above
# this root and deliberately outside the workspace, and `ledger.rs` reads
# `kynos-macros/src/lib.rs` to count what that crate declares. Shipping either
# would ship a test that can only fail, for everyone who runs `cargo test` on
# the tarball. Excluding them is what makes the archive honest -- each assertion
# is a property of the workspace, and stays where the workspace is.
#
# Both are auto-discovered rather than declared. Cargo rejects a `[[test]]`
# whose `path` is absent, so a declared target and an excluded file cannot both
# exist; the `required-features` `metaschema`'s declaration carried now sit in
# the file's own `#![cfg]`, which holds in both trees.
#
# The two cost baselines go for the same reason, one step further out. Their
# oracle is `scripts/cost_features.py` and the `cost:*` tasks in `mise.toml`,
# both above this root, so the instructions printed in each file's own header
# name commands a tarball does not contain; and what they record is a sweep of
# *this workspace's* features on a pinned toolchain, which is a property of the
# workspace rather than of the library someone downloaded. Shipping them would
# ship a table nobody receiving it can reproduce, compare against or act on.
#
# `cost/fixture.rs` stays, and must: it is a declared `[[example]]`, and the
# rule above applies to it in the other direction -- a declared target whose
# path is excluded is a manifest error, so the file the sweep measures travels
# even though the numbers it produced do not.
exclude = [
  "cost/binary.tsv",
  "cost/codegen.tsv",
  "tests/ledger.rs",
  "tests/metaschema.rs",
]

[[test]]
name = "ui"
path = "tests/ui.rs"

# The fixture directory `assets!` walks lives beside this target, so the target
# has to be declared or `tests/assets/` would be taken for one.
[[test]]
name = "assets"
path = "tests/assets.rs"
required-features = ["openapi31", "macros", "assets"]

[[test]]
name = "panic-recovery-check"
path = "tests/compile/panic_recovery.rs"
harness = false

[[example]]
name = "hello"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "errors"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "state"
required-features = ["openapi31", "macros", "server", "http1"]

[[example]]
name = "graceful_shutdown"
required-features = ["openapi31", "macros", "server", "http1"]

[[example]]
name = "scalars"
required-features = [
  "openapi31",
  "macros",
  "server",
  "http1",
  "json",
  "uuid",
  "time-chrono",
  "time-jiff",
  "decimal-rust",
  "decimal-big",
]

[[example]]
name = "schema"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "parameters"
required-features = ["openapi31", "macros", "server", "http1", "json", "cookie"]

[[example]]
name = "payloads"
required-features = [
  "openapi31",
  "macros",
  "server",
  "http1",
  "json",
  "form",
  "multipart",
]

[[example]]
name = "responses"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "negotiation"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "localized_errors"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "localization"
required-features = ["openapi31", "macros", "server", "http1"]

[[example]]
name = "composition"
required-features = ["openapi31", "macros", "server", "http1"]

[[example]]
name = "protobuf"
required-features = ["openapi31", "macros", "server", "http1", "protobuf"]

[[example]]
name = "streaming"
required-features = ["openapi32", "macros", "server", "http1", "json"]

[[example]]
name = "sse"
required-features = ["openapi32", "macros", "server", "http1", "compression"]

[[example]]
name = "tracing"
required-features = ["openapi31", "macros", "server", "http1", "trace"]

[[example]]
name = "auto_reload"
required-features = ["openapi31", "macros", "server", "http1"]

[[example]]
name = "print_request_response"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "document"
required-features = [
  "openapi32",
  "macros",
  "server",
  "http1",
  "json",
  "yaml",
]

[[example]]
name = "docs_ui"
# `docs` sits in the list rather than beside it: the wiring has to compile in
# both profiles, and `debug_assertions` decides only whether this deployment
# mounts it. `json` is now for the handlers' own payloads -- the description
# route is the framework's and states its own media type.
required-features = ["openapi31", "macros", "server", "http1", "json", "docs"]

[[example]]
name = "security_schemes"
required-features = ["openapi31", "macros", "server", "http1"]

[[example]]
name = "jwt"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "rate_limit"
required-features = ["openapi31", "macros", "server", "http1", "json"]

# The other half of the rate-limiting pair: `rate_limit` replaces the store,
# this replaces the algorithm. No dev-dependency, which is the point -- a
# process-local bucket is `std` and arithmetic.
[[example]]
name = "token_bucket"
required-features = ["openapi31", "macros", "server", "http1", "json"]
# An example is `test = false` by default, so the bucket's unit tests would
# compile under `--all-targets` and never run. They are the evidence for the
# claim the file makes about its injected clock, so they have to run.
test = true

# Ranged delivery over a source that is not a filesystem, which is the case
# `assets` cannot cover: it serves files.
[[example]]
name = "ranged"
required-features = ["openapi31", "macros", "server", "http1", "json"]

[[example]]
name = "cache"
required-features = ["openapi31", "macros", "server", "http1", "json", "cache"]

[[example]]
name = "assets"
# No `json`: nothing here has a JSON body. `assets-fs` implies `assets` and
# `unchecked`, which is the point the example is making.
required-features = ["openapi31", "macros", "server", "http1", "assets-fs"]

[[example]]
name = "cors"
# No `server`: this example drives a built `Service` directly, because what it
# demonstrates is the two exchanges a browser makes rather than a socket.
required-features = ["openapi31", "macros", "json"]

[[example]]
name = "csrf"
# No `server`, for the same reason `cors` has none: what this demonstrates is
# which requests are refused, which is a question about header combinations.
required-features = ["openapi31", "macros", "json", "cookie"]

[[example]]
name = "decompression"
required-features = [
  "openapi31",
  "macros",
  "server",
  "http1",
  "json",
  "compression",
]

[[example]]
name = "opentelemetry"
required-features = ["openapi31", "macros", "server", "http1", "json", "trace"]

[[example]]
name = "middleware"
required-features = [
  "openapi31",
  "macros",
  "server",
  "http1",
  "json",
  "compression",
  "trace",
]

[[example]]
name = "unchecked"
required-features = [
  "openapi31",
  "macros",
  "server",
  "http1",
  "json",
  "unchecked",
]

[[example]]
name = "testing"
# No `server` and no `http1`: this example drives a built `Service` directly,
# which is the whole point of it.
required-features = ["openapi31", "macros", "json", "test-util"]

[[example]]
name = "tls"
required-features = ["openapi31", "server", "http1", "http2", "tls"]

# The fixed fixture the two cost sweeps build. Declared with a `path` rather
# than dropped in `examples/` because `examples/README.md` is a catalogue of
# teaching examples and this is an instrument: it is here so it sits beside the
# baselines it produces, in `cost/`.
#
# Deliberately no `required-features`. The sweep builds the *same* program at
# every feature it visits, so a difference between two builds is attributable
# to the feature; a target that changed shape with the flag would measure two
# programs. That also puts it inside `features:targets` (`--all-targets`),
# which is what keeps it compiling at every feature without a gate of its own.
[[example]]
name = "cost_fixture"
path = "cost/fixture.rs"

[features]
default = [
  "openapi31",
  "macros",
  "server",
  "http1",
  "http2",
  "json",
  "trace",
]

# --- Specification version -------------------------------------------------
# `openapi31` is the baseline. `openapi32` is a strict superset: enabling it is
# additive for programs that use no 3.2-only construct. Cargo unifies features
# across a dependency graph, so anything in the build can turn this on for
# everything in it -- which is why every model type it extends with a variant is
# `#[non_exhaustive]`. A struct literal naming every field of a model type is
# the one construct that does not survive it.
openapi31 = ["kynos-openapi/openapi31"]
openapi32 = [
  "openapi31",
  "kynos-openapi/openapi32",
  "kynos-macros?/openapi32",
  # `response::stream` is the only thing that names a stream, and 3.1 has no
  # `itemSchema` to describe one with, so the whole subtree is 3.2-only.
  "dep:futures-core",
]

# --- Core ------------------------------------------------------------------
macros = ["dep:kynos-macros"]

# --- Runtime ---------------------------------------------------------------
server = [
  "dep:hyper-util",
  "dep:tracing",
  "tokio/net",
  "tokio/macros",
  "tokio/rt",
  "tokio/signal",
]
http1 = ["hyper/http1", "hyper-util?/http1"]
http2 = ["hyper/http2", "hyper-util?/http2"]
tls = ["server", "dep:tokio-rustls"]

# --- Codecs ----------------------------------------------------------------
# Application request and response payloads encoded as JSON. OpenAPI document
# serialization and RFC 9457 problem details remain available without it.
json = []
form = ["dep:serde_urlencoded"]
multipart = ["dep:multer"]
protobuf = ["dep:prost"]
# Kynos owns the RFC 6265 this needs. The `cookie` crate was declared here and
# named by no source line: the derive hand-rolled the jar and the response side
# did not exist. Using it now would put `cookie::Cookie` in a public signature,
# which `docs/architecture.md`'s re-export rule forbids.
cookie = []
compression = ["dep:async-compression"]

# --- Scalar formats --------------------------------------------------------
# A type from outside `std` whose whole contribution is a JSON Schema `format`.
# Each is additive and off by default; the mapping is normative in
# `docs/schema.md`.
uuid = ["dep:uuid"]

# `time` is an umbrella, not a library: it carries the shapes both backends map
# onto, so `date-time-local` is defined once and cannot change with a flag. It
# names no crate, and on its own it does not compile. Note it is unrelated to
# the `time` crate, which is not a backend and reaches the tree only through
# `rcgen`, a dev-dependency of the TLS example.
time = []
time-chrono = ["time", "dep:chrono"]
time-jiff = ["time", "dep:jiff"]

# The same shape for decimals. Both backends write a JSON string, which is the
# only representation that keeps the precision a decimal exists for.
decimal = []
decimal-rust = ["decimal", "dep:rust_decimal"]
decimal-big = ["decimal", "dep:bigdecimal"]

# --- Observability ---------------------------------------------------------
# The `tracing` facade only. Choosing a subscriber stays the application's call.
trace = ["dep:tracing"]

# --- Document emission -----------------------------------------------------
# The facade names `serde_yaml_ng` itself, rather than only forwarding, because
# `Error` converts from the YAML emitter's failure the same way it converts from
# the JSON one. A passthrough would leave the two emitters unusable in the same
# `kynos::Result` function.
yaml = ["dep:serde_yaml_ng", "kynos-openapi/yaml"]

# --- Testing ---------------------------------------------------------------
# The JSON Schema validator is pulled in here rather than unconditionally: a
# normal build never checks a response against a schema, so it never carries
# one.
test-util = ["dep:jsonschema"]

# --- Response cache --------------------------------------------------------
# The store half (`Cache`) and the validator half (`Conditional`). The store
# itself is the application's, which is the line `rate_limit` already draws:
# prescribing one would mean prescribing a dependency.
cache = []

# --- Static assets ---------------------------------------------------------
# `assets` compiles a directory into the binary as one described operation per
# file: every path is a literal, so nothing is waived. `assets-fs` serves a
# directory whose membership is not fixed, which no path template can express --
# so it implies `unchecked` and is recorded at the document root.
assets = ["kynos-macros?/assets"]
# `io-util` is what lets a range be read rather than sliced: a seek and one
# sized read cost the part, where reading the file and slicing costs the whole.
assets-fs = ["assets", "unchecked", "tokio/fs", "tokio/io-util"]

# --- API reference ---------------------------------------------------------
# Mounts the page a human opens and the description it fetches, as two ordinary
# described operations. Off by default because turning it on widens the
# published contract by two `paths` keys: a client generated from a
# docs-enabled deployment carries two operations a docs-disabled one does not,
# and that is a deployment's decision rather than the framework's. Hiding the
# pair behind `unchecked` instead would stamp the whole document
# non-authoritative in order to conceal routes Kynos itself mounted.
#
# It names no crate. `serde_json` is already unconditional, and a renderer is a
# string -- each built-in page is a script tag, so a third is `Docs::custom`
# rather than a pull request here. Note it does not imply `json`, which is
# about application payloads: the description route states its own media type
# rather than reaching for the `media::Json` marker that feature gates.
docs = []

# --- Escape hatch ----------------------------------------------------------
# Unlocks `layer_unchecked`, `route_unchecked` and `upgrade_unchecked`. What
# they reach is recorded and flagged rather than dropped -- an operation stays
# in `paths` marked opaque, a route with no expressible template is listed at
# the document root -- and the document is stamped non-authoritative.
# Documented anti-pattern.
unchecked = ["dep:tower", "dep:tower-service"]

full = [
  "assets",
  "cache",
  "docs",
  "openapi32",
  "macros",
  "server",
  "http1",
  "http2",
  "json",
  "tls",
  "form",
  "multipart",
  "protobuf",
  "cookie",
  "compression",
  "trace",
  "yaml",
  "test-util",
  "uuid",
  "time-chrono",
  "time-jiff",
  "decimal-rust",
  "decimal-big",
]

[dependencies]
kynos-macros = { workspace = true, optional = true }
kynos-openapi = { workspace = true, features = ["http"] }

async-compression = { workspace = true, optional = true, features = [
  "tokio",
  "gzip",
  "brotli",
  "zstd",
] }
bigdecimal = { workspace = true, optional = true }
bytes = { workspace = true }
chrono = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
http = { workspace = true }
http-body = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["server"] }
hyper-util = { workspace = true, optional = true, features = [
  "server",
  "tokio",
] }
jiff = { workspace = true, optional = true }
jsonschema = { workspace = true, optional = true }
matchit = { workspace = true }
multer = { workspace = true, optional = true }
percent-encoding = { workspace = true }
prost = { workspace = true, optional = true }
rust_decimal = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_urlencoded = { workspace = true, optional = true }
serde_yaml_ng = { workspace = true, optional = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["sync", "time"] }
tokio-rustls = { workspace = true, optional = true }
tower = { workspace = true, optional = true }
tower-service = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
# `multer`'s reader takes a `Stream`, so the test that reparses a rendered
# multipart body with an independent reader has to name one. It is a
# dev-dependency rather than an edge on the `multipart` feature because only
# the test wants it: `futures-core` reaches the library through `openapi32`
# alone, and widening that to `multipart` would put a dependency in a 3.1 build
# for a type no shipped code names. It adds nothing to the graph either --
# `multer` already pulls it in through `futures-util` -- so, like `bytes` and
# `http-body-util` below, it cannot perturb the `.stderr` snapshots.
futures-core = { workspace = true }
jsonwebtoken = { workspace = true }
moka = { workspace = true }
# An integration target drives `Service::call` and then has to read the
# response, which means naming the body's own crates. Both are already
# dependencies of the library, so this adds nothing to the graph -- and unlike
# a genuinely new dev-dependency it cannot perturb the `.stderr` snapshots that
# embed rustc's "the following other types implement" list.
bytes = { workspace = true }
http-body-util = { workspace = true }
hyper = { workspace = true, features = ["client", "http1", "http2"] }
# Applications derive serde alongside `kynos::Schema`, and the schema derive
# reads those attributes, so the tests have to be able to write them.
serde = { workspace = true, features = ["derive"] }
alloc_counter = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
# The UI suite hands `Router::intercept` a real `tower::Layer`, so the negative
# and its control differ only in whether the middleware declares itself.
tower = { workspace = true }
trybuild = { workspace = true }
# A scalar format claims a wire form, and the claim is only worth as much as a
# test that serializes the type and looks. That needs the serde integration the
# library itself does not.
bigdecimal = { workspace = true, features = ["serde"] }
# `clock` is what makes `Local` exist. Kynos's own dependency does not enable
# it, but chrono's defaults do, so an application almost always has it -- and
# the UI case proving `DateTime<Local>` is refused has to fail for that reason
# rather than because the type is missing.
chrono = { workspace = true, features = ["alloc", "clock", "serde"] }
# `tzdb-bundle-always` rather than the platform database, so a test that names a
# zone does not depend on what the host has installed.
jiff = { workspace = true, features = [
  "std",
  "serde",
  "tzdb-bundle-always",
] }
# The TLS example mints its own certificate at startup, so it runs with nothing
# prepared and nothing committed -- no PEM in the repository to expire, and no
# reader blocked on generating one first.
rcgen = { workspace = true }
# The auto-reload example inherits a socket from `systemfd`. Reading a file
# descriptor out of the environment is the supervisor's protocol rather than the
# framework's, so the crate that speaks it stays a dev-dependency.
listenfd = { workspace = true }
rust_decimal = { workspace = true, features = ["serde"] }
# Kynos depends on the `tracing` facade and deliberately never on a subscriber,
# so the tracing example has to install one itself -- otherwise the feature's
# whole output would be invisible to the reader it exists for.
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }
# The same argument one layer further out: the OpenTelemetry example wires a
# real exporter, and the crates that speak OTLP stay here rather than becoming
# something the framework binds every application to.
opentelemetry = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["rt-tokio"] }
opentelemetry-otlp = { workspace = true, features = ["grpc-tonic", "trace"] }
opentelemetry-semantic-conventions = { workspace = true }
tracing-opentelemetry = { workspace = true }
uuid = { workspace = true, features = ["serde"] }

[lints]
workspace = true

# docs.rs builds with default features unless told otherwise, which for Kynos
# would publish a framework with no TLS, no codec beyond JSON, no scalar format,
# no static assets and no escape hatch -- most of the surface `docs/` describes.
# `all-features` rather than a list because a list is a second copy of the
# feature table that drifts, and because this is exactly what
# `mise run docs:check` already builds with warnings denied: what docs.rs
# publishes is what CI proved.
#
# Deliberately no `rustdoc-args` and no `#![cfg_attr(docsrs, ...)]` in
# `src/lib.rs`. The "available on crate feature X only" badges need rustdoc's
# unstable `doc_cfg` gate, which is a nightly-only commitment across all three
# crates and a separate decision. What must not come back is the older
# `feature(doc_auto_cfg)` incantation: rustc removed that gate in 1.92.0, merged
# into `doc_cfg` (rust-lang/rust#138907), so writing it would fail the docs.rs
# build outright with E0557 rather than degrade.
[package.metadata.docs.rs]
all-features = true
