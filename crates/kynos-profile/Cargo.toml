[package]
name = "kynos-profile"
description = "Instruction and heap counts over Kynos's in-process request path."
version = "0.0.0"
edition.workspace = true
# No `rust-version`: gungraun needs 1.88, and stating it would conflict with
# `clippy.toml`'s `msrv`. `msrv:check` excludes this unpublished package.
license.workspace = true
repository.workspace = true
# Keeps gungraun out of `kynos`'s dev-dependencies and tarball.
publish = false

[dependencies]
# Every element a request can reach: `full`, plus `assets-fs` (and the
# `unchecked` it implies), the two request-path features `full` omits. Cargo
# unifies them, so the `*:baseline` tasks exclude this package.
kynos = { path = "../kynos", features = ["full", "assets-fs"] }
bytes = { workspace = true }
# The response head and the frame type a drained body leaves the region as.
http = { workspace = true }
http-body = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# Builds the `echo-post` body outside the measured region; the region itself
# reaches serde_json only through `kynos`.
serde_json = { workspace = true }
# `Driver::Runtime`'s current-thread runtime and its timer, named only in
# `src/driver.rs`, the row `architecture.md`'s runtime allowance gives it.
tokio = { workspace = true, features = ["rt", "time"] }

[dev-dependencies]
# The stream a test drains frame by frame.
futures-core = { workspace = true }
gungraun = { workspace = true }

# gungraun-runner spawns each benchmark under Valgrind.
[[bench]]
name = "requests"
harness = false

[lints]
workspace = true
