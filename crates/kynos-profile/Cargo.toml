[package]
name = "kynos-profile"
description = "Instruction and heap counts over Kynos's in-process request path."
version = "0.0.0"
edition.workspace = true
# No `rust-version`: gungraun needs 1.88, and stating it would conflict with
# `clippy.toml`'s `msrv`. `msrv:check` excludes this unpublished package.
license.workspace = true
repository.workspace = true
# Keeps gungraun out of `kynos`'s dev-dependencies and tarball.
publish = false

[dependencies]
# Default features, plus `compression` for the encoding sweep. Cargo unifies it,
# so the `*:baseline` tasks exclude this package.
kynos = { path = "../kynos", features = ["compression"] }
bytes = { workspace = true }
serde = { workspace = true, features = ["derive"] }
# Builds the `echo-post` body outside the measured region; the region itself
# reaches serde_json only through `kynos`.
serde_json = { workspace = true }

[dev-dependencies]
gungraun = { workspace = true }
http-body-util = { workspace = true }

# gungraun-runner spawns each benchmark under Valgrind.
[[bench]]
name = "requests"
harness = false

[lints]
workspace = true
