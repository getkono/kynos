[package]
name = "kynos-openapi"
description = "OpenAPI 3.1 and 3.2 document model, serialization and validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# As in `crates/kynos/Cargo.toml`.
readme = "README.md"
# Usable without the runtime, so keyed to the document model.
keywords = ["openapi", "oas", "json-schema", "schema", "rest"]
categories = ["web-programming", "data-structures", "encoding"]

[[example]]
name = "standalone"
required-features = ["openapi32", "yaml"]

[features]
default = ["openapi31"]
# The 3.1 object model, the baseline.
openapi31 = []
# The 3.2 object model, a strict superset of 3.1.
openapi32 = ["openapi31"]
yaml = ["dep:serde_yaml_ng"]
# `Method` to and from `http::Method`; optional so the model stays runtime-free.
# Here because the orphan rule forbids `kynos` from writing it.
http = ["dep:http"]

[dependencies]
http = { workspace = true, optional = true }
indexmap = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
alloc_counter = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

# As in `crates/kynos/Cargo.toml`.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
