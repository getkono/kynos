[package]
name = "kynos-openapi"
description = "OpenAPI 3.1 and 3.2 document model, serialization and validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[[example]]
name = "standalone"
required-features = ["openapi32", "yaml"]

[features]
default = ["openapi31"]
# The 3.1 object model. Baseline: every other feature builds on it.
openapi31 = []
# The 3.2 object model, a strict superset of 3.1. Fields introduced by 3.2 are
# `#[cfg]`-gated rather than runtime-optional, so a 3.1-only build cannot
# construct a document it is unable to describe.
openapi32 = ["openapi31"]
yaml = ["dep:serde_yaml_ng"]

[dependencies]
indexmap = { workspace = true, features = ["serde"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = { workspace = true }

[lints]
workspace = true
