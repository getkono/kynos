[package]
name = "kynos-openapi"
description = "OpenAPI 3.1 and 3.2 document model, serialization and validation."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# See the note in `crates/kynos/Cargo.toml`: a crate's own README, not a link to
# the workspace one, because crates.io resolves relative links against the
# package's directory in the repository.
readme = "README.md"
# This crate is usable without the runtime, so it is findable on the terms of
# the document model rather than of the framework.
keywords = ["openapi", "oas", "json-schema", "schema", "rest"]
categories = ["web-programming", "data-structures", "encoding"]

[[example]]
name = "standalone"
required-features = ["openapi32", "yaml"]

[features]
default = ["openapi31"]
# The 3.1 object model. Baseline: every other feature builds on it.
openapi31 = []
# The 3.2 object model, a strict superset of 3.1; the README says what enabling
# it does to a downstream build.
openapi32 = ["openapi31"]
yaml = ["dep:serde_yaml_ng"]
# Conversions between `Method` and `http::Method`. Optional because this crate
# is otherwise runtime-free, which `docs/nfr.md` records as deliberate: a
# document model needs no HTTP implementation to describe HTTP. `kynos` turns it
# on unconditionally, so it costs a framework user nothing and a standalone user
# nothing unless asked for.
#
# The impls live here because the orphan rule puts them here: both types are
# foreign to `kynos`, so `kynos` cannot write them however much it wants to.
http = ["dep:http"]
# `pattern`: an ECMA-262 `pattern` translated to the `regex` engine's dialect.
# Here rather than in `kynos-macros` because both sides of a declaration need
# it: the derive translates a field's pattern when it expands, and `kynos` a
# map key's when the router is built, and two translators could disagree.
pattern = ["dep:regex", "dep:regex-syntax"]

[dependencies]
http = { workspace = true, optional = true }
indexmap = { workspace = true, features = ["serde"] }
regex = { workspace = true, optional = true }
regex-syntax = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true, optional = true }
thiserror = { workspace = true }

[dev-dependencies]
alloc_counter = { workspace = true }
proptest = { workspace = true }

[lints]
workspace = true

# docs.rs builds with default features unless told otherwise, which here would
# publish the 3.1 model alone: every field OpenAPI 3.2 introduces is `#[cfg]`-
# gated, so a default-features build documents a document model that cannot
# describe half of what the crate supports, and `yaml` would be invisible too.
# Why `all-features`, and what `--cfg docsrs` turns on, is the note in
# `crates/kynos/Cargo.toml`.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
