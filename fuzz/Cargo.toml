# The `cargo fuzz` targets over Kynos's hand-written parsers of untrusted
# input. What each one asserts, and where they run, is `docs/testing.md`'s
# (Fuzzing).
#
# A workspace of its own rather than a member of the root one: every target
# links libFuzzer and builds only on the nightly toolchain `cargo fuzz` needs,
# so as a member it would break every stable `--workspace` gate. Its lockfile
# is committed for the reason an application's is: a nightly run that fails
# should fail on Kynos, not on a dependency that moved overnight.
[package]
name = "kynos-fuzz"
version = "0.0.0"
edition = "2024"
license = "MIT"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]
members = ["."]

[dependencies]
# The base64 oracle the `basic` target holds Kynos's own decoder to.
base64 = "0.23.1"
# The reference encoders the `decompression` target codes its payloads with,
# at the versions `async-compression` already decodes with.
brotli = "9.0.0"
flate2 = "1.1.10"
libfuzzer-sys = "0.4.13"
# The struct the `strict_json` target reads, which only an object may become.
serde = { version = "1.0.229", features = ["derive"] }
# The values the `json_lines` target expects each framed record to decode to.
serde_json = "1.0.145"
zstd = "0.14.2"

# The baseline, plus only the features a fuzzed parser lives behind, since a
# smaller graph is a faster instrumented build: `multipart` for its
# `Content-Disposition` reader, `compression` for request decompression,
# `json` with `openapi32` for the `JsonLines` and `JsonSeq` record framer,
# `form` for `Form<T>`'s in-place UTF-8 check, `cache` for the request
# `Cache-Control` reader, and `server` for the PROXY protocol header reader,
# with `http1`, the one protocol it needs to compile. `openapi32` also brings
# `QueryString`.
[dependencies.kynos]
path = "../crates/kynos"
default-features = false
features = [
  "openapi32",
  "multipart",
  "compression",
  "json",
  "form",
  "cache",
  "server",
  "http1",
]

[[bin]]
name = "accept"
path = "fuzz_targets/accept.rs"
test = false
doc = false
bench = false

[[bin]]
name = "basic"
path = "fuzz_targets/basic.rs"
