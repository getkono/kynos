name: Set up
description: Install the pinned toolchain and restore this job's Cargo cache.

inputs:
  cargo-cache-key:
    description: >-
      Names the Cargo cache to restore. Jobs build with different feature sets
      and rustflags, so their artifacts do not interchange and each one needs
      its own key. Leave empty for a job that runs no Cargo build, or whose
      build lands outside the target directory this caches.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install tools
      uses: jdx/mise-action@v3
      with:
        version: 2026.7.18
        install: true
        cache: true

    - name: Restore Cargo cache
      if: inputs.cargo-cache-key != ''
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ inputs.cargo-cache-key }}
        # Only master writes the cache. GitHub scopes a cache to the branch
        # that created it, so a branch's own entries are readable by nobody
        # else while still counting against the repository-wide limit; letting
        # every branch save evicts the master entries that all of them read.
        save-if: ${{ github.ref == 'refs/heads/master' }}
