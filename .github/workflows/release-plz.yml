name: Release-plz

on:
  push:
    branches:
      - master

# Nothing is granted by default; each job asks for exactly what it needs.
permissions: {}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Publish unpublished versions, tag them, and cut the GitHub release; a no-op
  # unless the commit is a release-PR merge (`release_always = false`).
  #
  # No `concurrency`: a group keeps one pending job and cancels the older, so a
  # third push would discard the release the second queued. Release-plz checks
  # the registry and the tag itself.
  release:
    name: Release
    # A fork's own master must not attempt to publish getkono's crates.
    if: github.repository_owner == 'getkono'
    runs-on: ubuntu-latest
    permissions:
      # Tags and the GitHub release, through the API.
      contents: write
      # The merged release pull request, for the announcement.
      pull-requests: read
      # crates.io Trusted Publishing; no registry token is stored, and nothing
      # reads `CARGO_REGISTRY_TOKEN` (`docs/releasing.md`).
      id-token: write
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Release-plz reads every tag and every commit since the last one.
          fetch-depth: 0
          # Release-plz uses the API, so no credential goes on disk.
          persist-credentials: false
      # The pinned toolchain every other job uses: `cargo publish` builds the
      # tarball with all features.
      - &setup
        name: Set up
        uses: ./.github/actions/setup
      - name: Run release-plz
        # Pinned to a commit: this step publishes, so a repointed tag would be
        # an unreviewed change. Dependabot keeps the pin current.
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Open or refresh the release pull request. Under `GITHUB_TOKEN` it starts no
  # checks by itself (`docs/releasing.md`).
  release-pr:
    name: Release PR
    if: github.repository_owner == 'getkono'
    runs-on: ubuntu-latest
    permissions:
      # The `release-plz-` branch.
      contents: write
      # Open the release pull request, and label it `release`.
      pull-requests: write
    # A superseded run loses nothing: the next push recomputes the pull request.
    concurrency:
      group: release-plz-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - *checkout
      - *setup
      - name: Run release-plz
        uses: release-plz/action@2eb1d8bcb770b4c48ccfaad919734b38b51958c9 # v0.5.131
        with:
          command: release-pr
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
