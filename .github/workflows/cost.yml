name: Cost

# The per-feature cost sweep and the request-path profile: the slow jobs no
# ordinary pull request waits on. The sweep is a trend after each merge and a
# release pull request's gate (`KYNOS_COST=check`, argued in
# `scripts/cost_features.py`; `docs/releasing.md` has the loop). The script,
# not YAML, decides what exit status a measurement earns.
on:
  push:
    branches:
      - master
  # Every pull request, so a required check is reported (as skipped) on each.
  pull_request:
  workflow_dispatch:
    inputs:
      check:
        description: >-
          Apply the release gate, to preview what a release PR will say. Always
          on for a release-plz- branch.
        type: boolean
        default: false

permissions:
  contents: read

# Master's runs are the trend; a superseded pull request run is not.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  cost:
    name: Cost trend
    # Never skipped on a release branch (`release-plz-`, per `docs/releasing.md`),
    # so no later run at a commit can report a skip over a failed gate.
    if: >-
      github.event_name != 'pull_request'
      || startsWith(github.head_ref, 'release-plz-')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # The report reads the baselines the last `kynos-v*` tag shipped.
          fetch-depth: 0
      # No `cargo-cache-key`: a save this size would evict master's entries, and
      # the sweep rebuilds every point anyway.
      - name: Set up
        uses: ./.github/actions/setup
      # Gated on a release branch whatever the event, so a manual run there
      # cannot pass in place of a refusal.
      - name: Measure per-feature codegen and binary deltas, and per-codec ones
        env:
          KYNOS_COST: >-
            ${{ (github.event_name == 'pull_request' || inputs.check
            || startsWith(github.ref_name, 'release-plz-')) && 'check' || '' }}
        run: mise run cost:features
      # Also after a refused gate: the re-record is reviewed against the report.
      - name: Add cost summary
        if: ${{ !cancelled() && hashFiles('cost-report.md') != '' }}
        run: cat cost-report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload cost report
        if: ${{ !cancelled() && hashFiles('cost-report.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: cost-report
          path: |
            cost-report.md
            cost-binary.tsv
            cost-codec.tsv
            cost-codegen.tsv

  profile:
    name: Profile trend
    # A trend only, until it shows whether a second per-release re-record pays.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
      # Pinned to `profile:valgrind`'s version: the CPU features Valgrind
      # reports decide which routines a dependency picks.
      - name: Install Valgrind
        uses: gungraun/setup-gungraun@v1
        with:
          runner-strategy: none
          valgrind-version: 3.27.1
          # Never the distribution's, which is a different version.
          valgrind-strategy: builder,source
      - name: Count instructions and heap blocks over the request path
        run: mise run profile:requests
      - name: Add profile summary
        if: ${{ !cancelled() && hashFiles('profile-report.md') != '' }}
        run: cat profile-report.md >> "$GITHUB_STEP_SUMMARY"
      # The Callgrind files attribute a moved count. CI is the host of record:
      # recording the baseline is copying `profile-requests.tsv` over `requests.tsv`.
      - name: Upload profile
        if: ${{ !cancelled() && hashFiles('profile-report.md') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: profile
          path: |
            profile-report.md
            profile-requests.tsv
            target/gungraun/kynos-profile/
