name: Fuzz

# The `fuzz/` targets, on the nightly toolchain `cargo fuzz` needs. Each night
# every target searches for a bounded time; `full.yml` replays the committed
# corpus. `docs/testing.md#fuzzing` has the reasons.
on:
  schedule:
    # 04:41 UTC, off the hour and clear of the mutants run at 03:17.
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long each target searches.
        type: string
        default: "1200"

permissions:
  contents: read

# A night's run queues behind the last rather than being cancelled by it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The listing `fuzz:check` replays, so the search covers the same targets.
  targets:
    name: Fuzz targets
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.list.outputs.targets }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up
        uses: ./.github/actions/setup
      - name: List the targets
        id: list
        run: |
          targets="$(mise run fuzz --list | jq -Rnc '[inputs]')"
          echo "targets=$targets" >> "$GITHUB_OUTPUT"

  search:
    name: Fuzz, nightly search
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One job per target.
      matrix:
        target: ${{ fromJSON(needs.targets.outputs.targets) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up
        uses: ./.github/actions/setup
      - name: Search for a failing input
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '1200' }}
          TARGET: ${{ matrix.target }}
        run: mise run fuzz "$TARGET" --seconds "$SECONDS_PER_TARGET"
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
