name: Fuzz

# The `fuzz/` targets, on the nightly toolchain `cargo fuzz` needs. A pull
# request replays the committed corpus; each night every target searches for a
# bounded time. `docs/testing.md#fuzzing` has the reasons.
on:
  pull_request:
  schedule:
    # 04:41 UTC, off the hour and clear of the mutants run at 03:17.
    - cron: "41 4 * * *"
  workflow_dispatch:
    inputs:
      seconds:
        description: How long each target searches.
        type: string
        default: "1200"

permissions:
  contents: read

# A superseded pull request run is cancelled; a night's run queues instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  corpus:
    name: Fuzz corpus replay
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      # No `cargo-cache-key`: the targets build under `fuzz/target/`.
      - name: Set up
        uses: ./.github/actions/setup
      - name: Build every target and replay its corpus
        run: mise run fuzz:check

  search:
    name: Fuzz, nightly search
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # One job per target. Keep in step with `fuzz/Cargo.toml`'s `[[bin]]`
      # list, which `fuzz:check` replays.
      matrix:
        target:
          - accept
          - basic
          - cookie
          - date
          - etag
          - forwarded
          - media_type
          - query
          - range
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
      - name: Search for a failing input
        env:
          SECONDS_PER_TARGET: ${{ inputs.seconds || '1200' }}
          TARGET: ${{ matrix.target }}
        run: mise run fuzz "$TARGET" --seconds "$SECONDS_PER_TARGET"
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts
          if-no-files-found: ignore
