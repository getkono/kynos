name: CI

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

# Superseding a pull request makes its in-flight run worthless, so stop paying
# for it. master is exempt because release-plz consumes those runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Incremental artifacts only pay off across edits in one working tree. CI has
  # no such tree, so they are dead weight in the cache and slow the build.
  CARGO_INCREMENTAL: 0

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    env:
      NEXTEST_PROFILE: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: checks
      - name: Run checks
        run: mise run check

  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: features
      - name: Check every feature combination
        run: mise run features:check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: msrv
      - name: Check the declared MSRV
        run: mise run msrv:check

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    env:
      NEXTEST_PROFILE: ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: coverage
      - name: Generate coverage report
        run: mise run coverage:ci
      - name: Add coverage summary
        run: cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # No Cargo build here, so no Cargo cache to restore.
      - name: Set up
        uses: ./.github/actions/setup
      - name: Check commits
        env:
          CONVCO_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: mise run commits:check
