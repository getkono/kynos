name: CI

on:
  push:
    branches:
      - master
  # Every pull request, whatever it targets. Filtering on `master` meant a
  # stacked pull request -- one based on another that has not merged yet --
  # reported no checks at all, so the only evidence it had was its author
  # saying the gates passed locally. That is the wrong half of the review to
  # trust, and it is exactly the review where a long-lived base branch makes
  # stacking the sensible way to work.
  pull_request:

permissions:
  contents: read

# Superseding a pull request makes its in-flight run worthless, so stop paying
# for it. master is exempt because release-plz consumes those runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only pay off across edits in one working tree. CI has
  # no such tree, so they are dead weight in the cache and slow the build.
  CARGO_INCREMENTAL: 0
  NEXTEST_PROFILE: ci

# Between them these jobs run every task in `mise run check`, plus the three
# that are too slow to belong there. Splitting them apart trades one serial
# runner for parallel ones and gives each its own Cargo cache; keep a task in
# exactly one job so no two jobs compile the same thing.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: lint
      - name: Check formatting
        run: mise run format:check
      - name: Lint
        run: mise run lint
      # A second Clippy pass rather than a second job: `--all-features` and the
      # default set share every dependency build, so they belong on one cache.
      - name: Lint at baseline features
        run: mise run lint:baseline
      # Here because it compiles nothing, so it wants no Cargo cache of its
      # own. It belongs in some job: `check` runs it, and the comment above
      # says these jobs run every task `check` does.
      - name: Verify the vendored specifications
        run: mise run references:verify

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: test
      # The instrumented run is the test of record. It selects the same tests
      # as `mise run test`, so running both would execute the suite twice --
      # except the compile-fail suite, which cannot run instrumented.
      - name: Run tests under coverage
        run: mise run coverage:ci
      - name: Run the compile-fail suite
        run: mise run ui:check
      - name: Add coverage summary
        run: cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: docs
      # Paired with the rustdoc build: both compile the workspace with every
      # feature and no extra rustflags, so the second reuses the first's deps.
      - name: Run doc tests
        run: mise run test:doc
      - name: Build documentation
        run: mise run docs:check

  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: features
      # Ahead of `features:check`, which rewrites manifests in place while it
      # walks the powerset: a run that shares a job with it must not follow it.
      - name: Test at baseline features
        run: mise run test:baseline
      - name: Check every feature combination
        run: mise run features:check
      # After `features:check`, which strips dev-dependencies while it walks:
      # this one needs them, so it must not run against a manifest that job
      # left rewritten.
      - name: Check every target at each feature
        run: mise run features:targets
      # Also a check that a build configuration is rejected, so it belongs
      # here rather than on the critical path in `test`.
      - name: Check panic recovery gating
        run: mise run panic:check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: msrv
      - name: Check the declared MSRV
        run: mise run msrv:check

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # No Cargo build here, so no Cargo cache to restore.
      - name: Set up
        uses: ./.github/actions/setup
      - name: Check commits
        env:
          CONVCO_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: mise run commits:check
