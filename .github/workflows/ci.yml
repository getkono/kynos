name: CI

on:
  push:
    branches:
      - master
  # Whatever it targets, so a stacked pull request is checked too.
  pull_request:

permissions:
  contents: read

# master is exempt: release-plz consumes those runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# What every pull request waits on, kept narrow. `full.yml` runs the rest of
# `mise run check` and the slower checks; between the two, each task runs in
# exactly one job.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: lint
      - name: Check formatting
        run: mise run format:check
      - name: Lint
        run: mise run lint
      # The gates below compile nothing, so they need no cache of their own.
      - name: Verify the vendored specifications
        run: mise run references:verify

      - name: Verify dependency and runtime containment
        run: mise run containment:check

      - name: Test the containment gate's parsers
        run: mise run containment:test

      - name: Verify the dev build profile and the Python floor
        run: mise run tooling:check

      - name: Test the tooling gate's rules
        run: mise run tooling:test

      - name: Test the cost sweep's parsers and report
        run: mise run cost:test

      - name: Test the request-path profile's parsers and report
        run: mise run profile:test

      # Not in `commits`, which runs on pull requests only.
      - name: Test that the commit rule's two halves agree
        run: mise run commits:test

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: test
      # Uninstrumented, and with the `ui` suite; `full.yml` measures coverage.
      - name: Run tests
        run: mise run test

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: docs
      # Same features and flags as the rustdoc build, so they share deps.
      - name: Run doc tests
        run: mise run test:doc
      - name: Build documentation
        run: mise run docs:check

  # Its own job: the one gate that can turn red with no change here, when a new
  # advisory names something locked. It blocks; waivers live in `deny.toml`.
  deny:
    name: Dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      # No Cargo build here, so no Cargo cache to restore.
      - name: Set up
        uses: ./.github/actions/setup
      - name: Check advisories, licences, bans and sources
        run: mise run deny:check

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # No Cargo build here, so no Cargo cache to restore.
      - name: Set up
        uses: ./.github/actions/setup
      - name: Check commits
        env:
          CONVCO_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: mise run commits:check
