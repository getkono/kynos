name: CI

on:
  push:
    branches:
      - master
  # Every pull request, whatever it targets. Filtering on `master` meant a
  # stacked pull request -- one based on another that has not merged yet --
  # reported no checks at all, so the only evidence it had was its author
  # saying the gates passed locally. That is the wrong half of the review to
  # trust, and it is exactly the review where a long-lived base branch makes
  # stacking the sensible way to work.
  pull_request:

permissions:
  contents: read

# Superseding a pull request makes its in-flight run worthless, so stop paying
# for it. master is exempt because release-plz consumes those runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Incremental artifacts only pay off across edits in one working tree. CI has
  # no such tree, so they are dead weight in the cache and slow the build.
  CARGO_INCREMENTAL: 0
  NEXTEST_PROFILE: ci

# Between them these jobs run every task in `mise run check`, plus the four
# that are too slow to belong there. Splitting them apart trades one serial
# runner for parallel ones and gives each its own Cargo cache; keep a task in
# exactly one job so no two jobs compile the same thing.
jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: lint
      - name: Check formatting
        run: mise run format:check
      - name: Lint
        run: mise run lint
      # A second Clippy pass rather than a second job: `--all-features` and the
      # default set share every dependency build, so they belong on one cache.
      - name: Lint at baseline features
        run: mise run lint:baseline
      # Here because it compiles nothing, so it wants no Cargo cache of its
      # own. It belongs in some job: `check` runs it, and the comment above
      # says these jobs run every task `check` does.
      - name: Verify the vendored specifications
        run: mise run references:verify

      # Here for the same reason, and beside that one because it is the same
      # kind of gate: it reads committed text rather than compiling anything.
      - name: Verify dependency and runtime containment
        run: mise run containment:check

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: test
      # The instrumented run is the test of record. It selects the same tests
      # as `mise run test`, so running both would execute the suite twice --
      # except the compile-fail suite, which cannot run instrumented.
      - name: Run tests under coverage
        run: mise run coverage:ci
      - name: Run the compile-fail suite
        run: mise run ui:check
      - name: Add coverage summary
        run: cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage-summary.txt

  docs:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: docs
      # Paired with the rustdoc build: both compile the workspace with every
      # feature and no extra rustflags, so the second reuses the first's deps.
      - name: Run doc tests
        run: mise run test:doc
      - name: Build documentation
        run: mise run docs:check

  features:
    name: Feature matrix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: features
      # Ahead of `features:check`, which rewrites manifests in place while it
      # walks the powerset: a run that shares a job with it must not follow it.
      - name: Test at baseline features
        run: mise run test:baseline
      - name: Check every feature combination
        run: mise run features:check
      # After `features:check`, which strips dev-dependencies while it walks:
      # this one needs them, so it must not run against a manifest that job
      # left rewritten.
      - name: Check every target at each feature
        run: mise run features:targets
      # Also a check that a build configuration is rejected, so it belongs
      # here rather than on the critical path in `test`.
      - name: Check panic recovery gating
        run: mise run panic:check

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: msrv
      - name: Check the declared MSRV
        run: mise run msrv:check

  semver:
    name: API compatibility
    runs-on: ubuntu-latest
    # Reports the verdict; does not fail the pull request on a break.
    #
    # `continue-on-error` is deliberately *not* used here. It keeps the
    # workflow's own conclusion green but leaves the check run reporting
    # `failure`, so the pull request still shows a red mark -- which is the
    # thing this job must not do, because it fails on every pull request today
    # regardless of what that pull request changed. The baseline is the
    # published 0.1.0, and `Router::group`/`nest`/`merge` plus `Timeout`'s new
    # private field are breaks the pending 0.2.0 release exists to express;
    # pre-1.0 a minor bump *is* how a break is declared. A red mark that means
    # "the last release has not happened yet" teaches reviewers to ignore the
    # column.
    #
    # So the verdict goes to the job summary, where `coverage:ci` already puts
    # its own, and the step separates the two outcomes that matter:
    # semver-checks ran and found breaks (report, pass) from semver-checks
    # could not run at all (fail). An advisory job that swallows every exit
    # code cannot tell a clean run from a broken toolchain, which is the
    # failure `release-plz.toml` records about the release-time copy and the
    # one this job exists to not repeat.
    #
    # When 0.2.0 is published the baseline moves past both breaks. At that
    # point this becomes a plain `run: mise run semver:check`, and making it
    # required is a change to the `master` ruleset rather than to this file.
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up
        uses: ./.github/actions/setup
        with:
          cargo-cache-key: semver
      - name: Compare the public API against the last published release
        run: |
          set -o pipefail
          mise run semver:check 2>&1 | tee semver.log || true

          # `CARGO_TERM_COLOR: always` is set for the whole workflow, so
          # semver-checks colours its verdict -- and puts a reset escape
          # *between* `Summary` and the words after it. A pattern written
          # against the plain text matches nothing, silently: the first version
          # of this step reported "no verdict" for a run that had just printed
          # two of them. Parse a stripped copy; the live log keeps its colour.
          sed -r 's/\x1b\[[0-9;]*m//g' semver.log > semver.txt

          if grep -q 'Summary semver requires new major version' semver.txt; then
            verdict=broken
          elif grep -q 'Summary no semver update required' semver.txt; then
            verdict=clean
          else
            echo "::error::cargo-semver-checks produced no verdict; treating as a job failure"
            exit 1
          fi

          {
            echo "## API compatibility against the last published release"
            echo
            if [ "$verdict" = clean ]; then
              echo "No break against the published baseline."
            else
              echo "Breaks against the published baseline, listed below."
              echo
              echo "Pre-1.0, a minor bump is how a break is declared, so this is"
              echo "evidence for the release review rather than a failure of this"
              echo "pull request."
            fi
            echo
            echo '```'
            grep -E '^(--- failure|Failed in:|  [a-z]|[[:space:]]+Summary )' semver.txt \
              | sed "s#$GITHUB_WORKSPACE/##g"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      # No `cargo-cache-key`. `cargo package` verifies by extracting each
      # `.crate` and building it under `target/package/<crate>-<version>/target`,
      # beside a staging registry in `target/package/tmp-registry/` -- neither of
      # which `Swatinem/rust-cache` keys or prunes, so caching this job would
      # spend the repository's cache budget on three extracted source trees, on
      # a job whose next run rebuilds from a pristine extraction by design. The
      # cost is re-fetching the dependency graph each run, which is the cheaper
      # half.
      - name: Set up
        uses: ./.github/actions/setup
      # `cargo package` refuses to archive a dirty tree, and `actions/checkout`
      # leaves a clean one, so this also proves the archive is exactly what the
      # commit says it is.
      - name: Package every crate
        run: mise run publish:check

  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # No Cargo build here, so no Cargo cache to restore.
      - name: Set up
        uses: ./.github/actions/setup
      - name: Check commits
        env:
          CONVCO_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: mise run commits:check
