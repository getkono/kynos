# Routine version drift should arrive as a pull request that CI can judge, not
# as an issue a human has to read first. The dependency issue form says as much
# and closes reports of semver-compatible bumps, which is only fair if something
# else is actually opening them.
version: 2
updates:
  # `versioning-strategy: lockfile-only` moves `Cargo.lock` alone: the
  # requirements in `[workspace.dependencies]` stay as written, so each one
  # keeps stating the lowest version Kynos promises to build against, which
  # `minimal-versions:check` holds it to. Cargo accepts only `lockfile-only`
  # and `auto` here, and `auto` would rewrite a requirement whenever the
  # lockfile alone could not take the update.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    versioning-strategy: lockfile-only
    open-pull-requests-limit: 5
    # `ci:full`: a bump is what moves the MSRV or breaks a feature combination,
    # which only the comprehensive tier checks.
    labels:
      - chore
      - ci:full
    # `prefix` plus `include: scope` yields `chore(deps): bump ...`, which convco
    # accepts and `release-plz.toml`'s changelog parsers skip: it changes what a
    # downstream build resolves, but nothing Kynos itself does. A major needs a
    # requirement rewritten, which `lockfile-only` never does, so none arrives
    # here: a human raises it, because that is where the containment table gets
    # consulted.
    commit-message:
      prefix: chore
      prefix-development: chore
      include: scope
    groups:
      cargo:
        patterns:
          - "*"
        update-types:
          - minor
          - patch

  # Two entries, because `directory: "/"` reaches `.github/workflows` and a
  # repository-root `action.yml` and nothing else. The composite action holds
  # its own pins -- `jdx/mise-action` and `Swatinem/rust-cache` -- and with one
  # entry they were the two actions in this repository Dependabot never looked
  # at.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - chore
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: "/.github/actions/setup"
    schedule:
      interval: weekly
    labels:
      - chore
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns:
          - "*"
