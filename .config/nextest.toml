[profile.default]
# Tests are hermetic: a flake is an isolation bug, so never retry it away.
retries = 0
fail-fast = false
# Async tests deadlock instead of failing; bound them so the culprit is named.
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = { period = "100ms", result = "fail" }

# Inherits the default profile; only the log-shape and the filter differ.
[profile.ci]
failure-output = "immediate-final"
# `mise run coverage:ci` runs this profile under `llvm-cov`, which exports
# instrumentation flags to every child `cargo`. trybuild spawns one, so the UI
# suite would be built instrumented -- slow, and enough to perturb the exact
# stderr the snapshots record. It runs under the default profile instead.
default-filter = 'not binary(ui)'
