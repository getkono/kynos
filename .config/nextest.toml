[profile.default]
# Tests are hermetic: a flake is an isolation bug, so never retry it away.
retries = 0
fail-fast = false
# Async tests deadlock instead of failing; bound them so the culprit is named.
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = { period = "100ms", result = "fail" }

# Inherits the default profile; only the log shape differs.
#
# The UI suite is *not* filtered out here. It was, and the filter is
# profile-wide while the reason is not: `NEXTEST_PROFILE=ci` covers every CI
# job, so excluding the suite from the profile excluded it from CI entirely and
# forty-two compile-fail snapshots passed by never being run. The exclusion
# belongs on the one command that needs it -- see `coverage:ci` in `mise.toml`.
[profile.ci]
failure-output = "immediate-final"
