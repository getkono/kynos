[profile.default]
# Tests are hermetic: a flake is an isolation bug, so never retry it away.
retries = 0
fail-fast = false
# Async tests deadlock instead of failing; bound them so the culprit is named.
slow-timeout = { period = "30s", terminate-after = 4 }
leak-timeout = { period = "100ms", result = "fail" }
# `kynos-profile`'s benchmark is a gungraun binary: it runs only under
# gungraun-runner and Valgrind, and without them it cannot even list itself,
# so `--all-targets` would fail every run on a binary that holds no tests. A
# binary-level predicate, so nextest never executes it to ask. It runs as
# `mise run profile:requests` instead, and that package's fixture is held by
# its ordinary tests, which this leaves in.
default-filter = "not (package(kynos-profile) & kind(bench))"

# The compile-fail suite is one test that drives `rustc` over every fixture in
# `tests/ui/` -- each compile-fail case and its control, a set that grows with
# every case added -- so the two-minute bound above — which exists to name an
# async test that has deadlocked — measures the wrong thing here and terminates
# a healthy run on a cold cache. Slow by construction is not the failure that
# bound is for, and raising it for every test would blunt it where it works.
#
# Windows builds and links each `pass` fixture far slower, and the ten-minute
# bound stopped a healthy run halfway through them with every case so far `ok`.
# Its own bound comes first, since the first matching override wins.
[[profile.default.overrides]]
platform = 'cfg(windows)'
filter = 'binary(ui)'
slow-timeout = { period = "60s", terminate-after = 30 }

[[profile.default.overrides]]
filter = 'binary(ui)'
slow-timeout = { period = "60s", terminate-after = 10 }

# Inherits the default profile; only the log shape differs.
#
# The UI suite is *not* filtered out here. It was, and the filter is
# profile-wide while the reason is not: `NEXTEST_PROFILE=ci` covers every CI
# job, so excluding the suite from the profile excluded it from CI entirely and
# forty-two compile-fail snapshots passed by never being run. The exclusion
# belongs on the one command that needs it -- see `coverage:ci` in `mise.toml`.
[profile.ci]
failure-output = "immediate-final"
