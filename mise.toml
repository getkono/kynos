monorepo_root = true

[monorepo]
config_roots = ["."]
lockfile = true

[tools]
# `rust-src` changes how rustc renders a failed `const` assertion, which the
# `ui` snapshots record (docs/testing.md#snapshots).
rust = { version = "1.97.1", profile = "minimal", components = [
  "clippy",
  "llvm-tools",
  "rust-analyzer",
  "rust-src",
  "rustfmt",
] }
hk = "1.53.0"
# Upstream release binaries rather than `cargo:`, which compiles from source.
"github:taiki-e/cargo-llvm-cov" = "0.8.7"
"github:taiki-e/cargo-hack" = "0.6.36"
# nextest tags releases `cargo-nextest-<version>`, so the tag is the version.
"github:nextest-rs/nextest" = { version = "cargo-nextest-0.9.140", exe = "cargo-nextest" }
"github:convco/convco" = "0.7.0"
"github:obi1kenobi/cargo-semver-checks" = "0.50.0"
"github:EmbarkStudios/cargo-deny" = "0.20.2"

[env]
# The nightly every task needing one installs and runs: `fuzz` and
# `minimal-versions:check`. Dated, since an undated nightly moves under a job
# between two nights, and a failure should be Kynos's own.
KYNOS_NIGHTLY = "nightly-2026-06-10"
# The Valgrind the request-path profile runs under, which `profile:valgrind`
# builds and `full.yml` installs, and where `profile:valgrind` puts it unless
# the caller exported one.
KYNOS_VALGRIND_VERSION = "3.27.1"
KYNOS_VALGRIND = "{{ get_env(name='KYNOS_VALGRIND', default=env.HOME ~ '/.local/share/kynos-valgrind') }}"

[tasks.format]
description = "Format the Rust workspace"
run = "cargo fmt --all"

[tasks."format:check"]
description = "Check Rust formatting"
run = "cargo fmt --all -- --check"

[tasks.lint]
description = "Lint all workspace targets with every feature enabled"
# Without `--all-features` Clippy never compiles an optional module.
run = "cargo clippy --workspace --all-targets --all-features -- -D warnings"

[tasks."lint:baseline"]
description = "Lint all workspace targets at baseline features"
# Lints the `#[cfg(not(feature = ...))]` arms `lint` never compiles.
# `kynos-profile` is excluded for `test:baseline`'s reason.
run = "cargo clippy --workspace --exclude kynos-profile --all-targets -- -D warnings"

[tasks."lint:codecs"]
description = "Lint every kynos target at each codec's own feature set"
# `openapi31 + macros (+ codec)`: the only builds that compile one codec's test
# and example gates alone (docs/testing.md#cross-cutting). Clippy, since what
# they catch is a dead or mis-gated item. Incremental stays on: the same six
# sets recur on every push. Written out, not looped, so each can be rerun alone.
run = '''
set -eu

for features in \
  openapi31,macros \
  openapi31,macros,json \
  openapi31,macros,form \
  openapi31,macros,multipart \
  openapi31,macros,protobuf \
  openapi31,macros,compression; do
  echo "linting kynos at $features"
  cargo clippy -p kynos --all-targets --no-default-features \
    --features "$features" -- -D warnings
done
'''

[tasks."lint:fix"]
description = "Apply Clippy fixes across the workspace"
run = "cargo clippy --fix --workspace --all-targets --all-features --allow-dirty --allow-staged -- -D warnings"

[tasks.test]
description = "Test all workspace targets"
run = "cargo nextest run --workspace --all-targets --all-features"

[tasks."test:baseline"]
description = "Test all workspace targets at baseline features"
# The only task that builds test targets with optional features off
# (docs/testing.md#cross-cutting). `ui` snapshots record an `--all-features`
# build. `kynos-profile` enables every request-path feature of `kynos`, which
# Cargo would unify on.
run = "cargo nextest run --workspace --exclude kynos-profile --all-targets -E 'not binary(ui)'"

[tasks."test:doc"]
description = "Run doc tests, which carry the compile-fail guarantees"
run = "cargo test --workspace --all-features --doc"

[tasks."test:arbitrary-precision"]
description = "Test kynos-openapi with serde_json's arbitrary_precision forced on"
# A downstream graph may unify `serde_json/arbitrary_precision` on; forced per
# invocation (docs/testing.md#cross-cutting). The two excluded `to_yaml` oracles
# differ from `serde_norway` by design under it, and are named exactly.
env = { CARGO_INCREMENTAL = "0" }
run = '''
cargo nextest run -p kynos-openapi \
  --features yaml,serde_json/arbitrary_precision --no-tests=fail \
  -E 'not (test(=emit::yaml::tests::an_extension_repeating_a_model_field_leaves_the_field_in_place) | (binary(properties) & test(=yaml_emission_is_what_serde_norway_writes_for_the_model)))'
'''

[tasks."features:check"]
description = "Lint every reachable feature combination"
# Clippy rather than `cargo check`: the only gate compiling partial feature
# combinations, so the only one that sees a warning needing one feature on and
# another off. `server`, `tls`, `time` and `decimal` do not compile alone; what
# implies them covers them. Incremental is off: each combination's session is
# never read again and nothing reclaims it.
env = { CARGO_INCREMENTAL = "0" }
run = '''
cargo hack clippy --workspace --feature-powerset --depth 2 --no-dev-deps \
  --exclude-no-default-features --exclude-all-features \
  --exclude-features default,server,tls,time,decimal \
  --at-least-one-of openapi31,openapi32 \
  -- -D warnings

cargo hack clippy -p kynos --feature-powerset --depth 2 --no-dev-deps \
  --features server \
  --exclude-no-default-features --exclude-all-features \
  --exclude-features default,time,decimal \
  --at-least-one-of openapi31,openapi32 \
  --at-least-one-of http1,http2 \
  -- -D warnings

sh scripts/refuses.sh \
  "server unexpectedly compiled without an HTTP protocol" \
  'the `server` feature requires at least one of `http1` or `http2`' \
  cargo check -p kynos --no-default-features --features openapi31,server

sh scripts/refuses.sh \
  "the time umbrella unexpectedly compiled without a backend" \
  'the `time` feature carries no types of its own' \
  cargo check -p kynos --no-default-features --features openapi31,time

sh scripts/refuses.sh \
  "the decimal umbrella unexpectedly compiled without a backend" \
  'the `decimal` feature carries no types of its own' \
  cargo check -p kynos --no-default-features --features openapi31,decimal
'''

[tasks."features:targets"]
description = "Compile every target, not only the library, at each feature"
# `features:check` passes `--no-dev-deps`, so this is what compiles tests and
# examples at a partial feature set: `openapi31` plus one feature at a time.
# Exclusions and incremental as `features:check`; `kynos-profile` has no features.
env = { CARGO_INCREMENTAL = "0" }
run = '''
cargo hack check --workspace --exclude kynos-profile --each-feature --all-targets \
  --features openapi31 \
  --exclude-features default,server,tls,time,decimal,full
'''

[tasks."cost:features"]
description = "Measure what each feature costs a linked artifact and monomorphized IR"
# `.text` at `--release`, the shipped artifact; IR at the dev profile, since
# fat LTO deletes the monomorphizations `llvm-lines` counts. The script drives
# the loop because every build overwrites the fixture. Runs in `full.yml`, not
# per pull request (docs/releasing.md). Arguments reach the script, so the
# variants below delegate here rather than restating the pins.
#
# Task-scoped pins stay out of every other job, and `mise lock` does not lock
# them. `cargo-llvm-lines` has no release binaries. `python` matches
# `PYTHON_FLOOR` in `scripts/tooling.py`; raise both in one commit.
tools = { "cargo:cargo-llvm-lines" = "0.4.48", python = "3.11.16" }
run = "python3 scripts/cost_features.py"

[tasks."cost:codegen"]
description = "The codegen half of the sweep alone"
run = "mise run cost:features --kind codegen"

[tasks."cost:codecs"]
description = "The codec half of the sweep alone: what mounting each codec costs"
# Weighs `.text` only, so it needs no `cargo-llvm-lines`.
tools = { python = "3.11.16" }
run = "python3 scripts/cost_features.py --kind codec"

[tasks."cost:record"]
description = "Record the measured deltas as the committed baseline"
# Writes all three baselines under `crates/kynos/cost/`, which a release pull
# request must match (docs/releasing.md). One alone: `--kind`, which reaches
# `cost:features`.
env = { KYNOS_COST = "overwrite" }
run = "mise run cost:features"

[tasks."cost:test"]
description = "Test the cost sweep's parsers and its report"
# The sweep's parsers and report, which regress silently; compiles nothing, so
# it is in `check`.
tools = { python = "3.11.16" }
run = "python3 scripts/cost_features_test.py"

[tasks."profile:valgrind"]
description = "Build the Valgrind the request-path profile runs under"
# From source into a user prefix, needing no root; CI installs it with
# `gungraun/setup-gungraun`. The digest is the reviewed tarball's, so it moves
# with `KYNOS_VALGRIND_VERSION`. Idempotent.
run = '''
set -eu
prefix="$KYNOS_VALGRIND"
version="$KYNOS_VALGRIND_VERSION"
digest=5d589152eb8071c02feab8ce6ab719e431a1fbc3e2b1700f5432632a8b9264dc
if "$prefix/bin/valgrind" --version 2>/dev/null | grep -qx "valgrind-$version"; then
  exit 0
fi
# Only this version, since another records a different host into the baseline.
if [ "$(valgrind --version 2>/dev/null)" = "valgrind-$version" ]; then
  exit 0
fi
work="$(mktemp -d)"
trap 'rm -rf "$work"' EXIT
curl -sSfL "https://sourceware.org/pub/valgrind/valgrind-$version.tar.bz2" -o "$work/valgrind.tar.bz2"
echo "$digest  $work/valgrind.tar.bz2" | sha256sum -c --quiet -
tar -xjf "$work/valgrind.tar.bz2" -C "$work"
cd "$work/valgrind-$version"
./configure --prefix="$prefix" >/dev/null
make -j"$(nproc)" >/dev/null
make install >/dev/null
"$prefix/bin/valgrind" --version
'''

[tasks."profile:requests"]
description = "Count instructions and heap blocks over the in-process request path"
# Callgrind and DHAT over `crates/kynos-profile/benches/requests.rs`, compared
# against `requests.tsv` by `scripts/profile_report.py` (docs/performance.md).
# The runner must equal the `=`-pinned `gungraun` library version.
tools = { "github:gungraun/gungraun" = "0.20.0", python = "3.11.16" }
depends = ["profile:valgrind"]
run = "python3 scripts/profile_report.py --run"

[tasks."profile:record"]
description = "Record the request-path profile as the committed baseline"
# Runs the whole profile first, so the baseline records this build.
env = { KYNOS_PROFILE = "overwrite" }
run = "mise run profile:requests"

[tasks."profile:test"]
description = "Test the request-path profile's parsers and its report"
# As `cost:test`, for the profile report.
tools = { python = "3.11.16" }
run = "python3 scripts/profile_report_test.py"

[tasks."fixtures:generate"]
description = "Regenerate the conformance-fixture corpus"
env = { KYNOS_FIXTURES = "overwrite" }
run = "cargo nextest run -p kynos --test conformance_corpus --all-features"

[tasks."references:verify"]
description = "Verify the vendored specification texts are unmodified"
# An edited file, an unlisted file, and a README digest naming no file.
run = '''
set -eu
cd references

sha256sum -c SHA256SUMS --quiet

listed="$(mktemp)"
present="$(mktemp)"
trap 'rm -f "$listed" "$present"' EXIT

awk '{ print $2 }' SHA256SUMS | sort >"$listed"
ls | grep -vx -e README.md -e SHA256SUMS | sort >"$present"

if ! diff -u "$listed" "$present"; then
  echo "references/SHA256SUMS does not list every vendored file" >&2
  exit 1
fi

quoted="$(mktemp)"
trap 'rm -f "$listed" "$present" "$quoted"' EXIT
grep -oE '\b[0-9a-f]{64}\b' README.md | sort -u >"$quoted"

while read -r digest; do
  if ! grep -qF "$digest" SHA256SUMS; then
    echo "README.md quotes digest $digest, which names no vendored file" >&2
    exit 1
  fi
done <"$quoted"
'''

[tasks."containment:check"]
description = "Verify every crate is named only where its owner allows"
# Reads the tables in `docs/` rather than restating them, over source with
# comments, string literals and `#[cfg(test)]` modules stripped.
tools = { python = "3.11.16" }
run = "python3 scripts/containment.py"

[tasks."containment:test"]
description = "Test what the containment gate reads its tables and its tree with"
# A broken parser or a rule no longer reached leaves the gate green, so both
# are tested here.
tools = { python = "3.11.16" }
run = "python3 scripts/containment_test.py"

[tasks."tooling:check"]
description = "Verify the dev build profile and the Python floor scripts/ is held to"
# `.cargo/config.toml`'s keys and tables, every script's grammar at the floor,
# and the `python` pin on every task that runs one.
tools = { python = "3.11.16" }
run = "python3 scripts/tooling.py"

[tasks."tooling:test"]
description = "Test the rules the tooling gate holds the repository to"
# A helper no longer called leaves the gate green.
tools = { python = "3.11.16" }
run = "python3 scripts/tooling_test.py"

[tasks."docs:check"]
description = "Build documentation with warnings denied"
# `missing_docs` is denied, so this also requires every public item documented.
run = "cargo doc --workspace --all-features --no-deps"
env = { RUSTDOCFLAGS = "-D warnings" }

[tasks."panic:check"]
description = "Verify panic recovery rejects aborting builds only when selected"
run = '''
set -eu
RUSTFLAGS="-C panic=abort" cargo check -p kynos --lib

RUSTFLAGS="-C panic=abort" sh scripts/refuses.sh \
  "panic recovery unexpectedly compiled with panic=abort" \
  'Kynos panic recovery requires `panic = "unwind"`' \
  cargo build -p kynos --test panic-recovery-check
'''

[tasks."msrv:check"]
description = "Verify the crate still builds on the declared MSRV"
# The toolchain is the workspace's `rust-version`, read from `Cargo.toml`.
# `kynos-profile` is unpublished and declares gungraun's higher floor.
run = '''
set -eu
msrv="$(sed -n 's/^rust-version = "\(.*\)"$/\1/p' Cargo.toml)"
if [ -z "$msrv" ]; then
  echo "Cargo.toml declares no rust-version" >&2
  exit 1
fi
rustup toolchain install "$msrv" --profile minimal --no-self-update
cargo +"$msrv" check --workspace --all-features --exclude kynos-profile
'''

[tasks."minimal-versions:check"]
description = "Build the workspace with every direct dependency at its declared lower bound"
# A requirement in `[workspace.dependencies]` is a promise that its minimum
# builds, and nothing else tests it: Cargo.lock holds whatever Dependabot last
# moved it to, so a bound left behind stays green everywhere until an
# application whose graph holds an older copy fails to resolve or build Kynos.
#
# Direct minimums only. A transitive dependency's minimum is its parent's
# promise, which this tree can neither keep nor fix.
#
# The library targets only, not `--all-targets`: a dev-dependency's bound
# reaches no application, and the resolution still holds them to resolving
# beside the rest, since Cargo resolves dev-dependencies either way.
# `kynos-profile` is excluded for `msrv:check`'s reason: it is published
# nowhere, so its bounds are nobody's promise.
#
# `-Z` needs nightly, `KYNOS_NIGHTLY`. The resolution rewrites Cargo.lock, so
# the committed one is put back however the task exits.
run = '''
set -eu
rustup toolchain install "$KYNOS_NIGHTLY" --profile minimal --no-self-update

lock="$(mktemp)"
cp Cargo.lock "$lock"
trap 'cp "$lock" Cargo.lock; rm -f "$lock"' EXIT

cargo +"$KYNOS_NIGHTLY" update -Z direct-minimal-versions
cargo +"$KYNOS_NIGHTLY" check --workspace --all-features --exclude kynos-profile
'''

[tasks."publish:check"]
description = "Package every crate exactly as crates.io will receive it"
# Rebuilds each crate from its tarball, the only check that sees a file the
# archive omits. `--workspace` resolves siblings from the staged archives, as
# `cargo publish` will (Cargo 1.90+; the MSRV is for building, not publishing).
# No `--allow-dirty`: an artifact must match a commit. The `--list` loop checks
# `LICENSE`, which no manifest key references. Both read the one set of
# packages `scripts/publishable.py` derives from the manifests.
tools = { python = "3.11.16" }
run = '''
set -eu

# An assignment carries the listing's status to `set -e`; a `for` list would
# not.
packages="$(python3 scripts/publishable.py)"

set --
for package in $packages; do
  if ! cargo package --list --quiet -p "$package" | grep -qx LICENSE; then
    echo "$package would be published without LICENSE" >&2
    exit 1
  fi
  set -- "$@" -p "$package"
done

cargo package "$@" --all-features
'''

[tasks."semver:check"]
description = "Compare the public API against the last published release"
# release-plz's own semver check compares default features only, so a break
# behind a flag would surface at release; this compares `--all-features` on
# `master` against the last published version. The report's verdict decides
# the exit: a break fails unless `--advisory`, which is how CI reports rather
# than blocks, and no verdict at all always fails. `semver-summary.md` records
# the verdict for CI's job summary.
usage = '''
flag "--advisory" help="Pass on a break; still fail when there is no verdict"
'''
run = '''
set -eu
log="$(mktemp)"
trap 'rm -f "$log"' EXIT

# The verdict decides, not the tool's own exit status.
cargo semver-checks check-release --workspace --all-features 2>&1 | tee "$log" || true

# `CARGO_TERM_COLOR=always` puts escapes inside the verdict line.
sed -r -i 's/\x1b\[[0-9;]*m//g' "$log"

if grep -q 'Summary semver requires new major version' "$log"; then
  verdict=broken
elif grep -q 'Summary no semver update required' "$log"; then
  verdict=clean
else
  echo "cargo-semver-checks produced no verdict" >&2
  exit 1
fi

{
  echo "## API compatibility against the last published release"
  echo
  if [ "$verdict" = clean ]; then
    echo "No break against the published baseline."
  else
    echo "Breaks against the published baseline, listed below."
    echo
    echo "Pre-1.0, a minor bump is how a break is declared, so this is"
    echo "evidence for the release review rather than a failure of this"
    echo "pull request."
  fi
  echo
  echo '```'
  grep -E '^(--- failure|Failed in:|  [a-z]|[[:space:]]+Summary )' "$log" \
    | sed "s#$PWD/##g"
  echo '```'
} >semver-summary.md

if [ "$verdict" = broken ] && [ "${usage_advisory:-false}" != true ]; then
  exit 1
fi
'''

[tasks."deny:check"]
description = "Check dependencies for advisories, licences, bans and sources"
# Policy is `deny.toml`'s. It fetches the advisory database, so a new advisory
# can fail a pull request that changed no dependency.
run = "cargo deny --locked check"

[tasks.coverage]
description = "Run tests with LLVM coverage"
# `ui` is excluded here and in `coverage:ci` for `ui:check`'s reason.
run = "cargo llvm-cov nextest --workspace --all-targets --all-features -E 'not binary(ui)'"

[tasks."ui:check"]
description = "Run the compile-fail suite"
# Never under `llvm-cov`: its flags reach trybuild's child `cargo` and perturb
# the stderr the snapshots record.
run = "cargo nextest run -p kynos --test ui --all-features"

[tasks."coverage:ci"]
description = "Generate CI coverage reports"
run = [
  "cargo llvm-cov nextest --workspace --all-targets --all-features --lcov --output-path lcov.info -E 'not binary(ui)'",
  "cargo llvm-cov report --summary-only | tee coverage-summary.txt",
]

[tasks.mutants]
description = "Mutation-test one crate, or every crate"
# Configured in `.cargo/mutants.toml`. `CARGO_TARGET_DIR` is unset so each
# mutant's scratch copy builds into its own `target/`; a shared one reports a
# stale build as fresh. The seed makes `proptest` verdicts reproduce.
tools = { "github:sourcefrog/cargo-mutants" = "27.1.0" }
env = { PROPTEST_RNG_SEED = "220" }
usage = '''
arg "[package]" help="kynos, kynos-openapi or kynos-macros; every crate when omitted"
flag "--shard <shard>" help="Run one shard, as k/n with k counting from 0"
flag "--in-diff <diff>" help="Mutate only the lines this diff file changes"
'''
run = '''
set -eu
unset CARGO_TARGET_DIR

case "${usage_package:-}" in
  "") set -- --workspace ;;
  kynos) set -- --package kynos --test-package kynos ;;
  kynos-openapi | kynos-macros) set -- --package "$usage_package" ;;
  *)
    echo "no mutated crate is called '$usage_package'" >&2
    exit 2
    ;;
esac

if [ -n "${usage_shard:-}" ]; then
  set -- "$@" --shard "$usage_shard"
fi
if [ -n "${usage_in_diff:-}" ]; then
  set -- "$@" --in-diff "$usage_in_diff"
fi

cargo mutants "$@"
'''

[tasks."mutants:diff"]
description = "Mutation-test the lines changed since the base branch"
# Diffed against the working tree, which is what cargo-mutants copies.
# `MUTANTS_BASE` is CI's base commit. `mutants` runs it, with its pins.
usage = '''
flag "--shard <shard>" help="Run one shard, as k/n with k counting from 0"
'''
run = '''
set -eu
set -- --in-diff target/mutants.diff
if [ -n "${usage_shard:-}" ]; then
  set -- "$@" --shard "$usage_shard"
fi

mkdir -p target
git diff "$(git merge-base "${MUTANTS_BASE:-origin/master}" HEAD)" >target/mutants.diff
mise run mutants "$@"
'''

[tasks.fuzz]
description = "Fuzz one parser target, or every one, for a bounded time each"
# See docs/testing.md#fuzzing. On `KYNOS_NIGHTLY`, which `cargo fuzz` needs.
# Discoveries go to the ignored `fuzz/target/`; committed seeds are only read.
# `--target` is the host: the musl-linked cargo-fuzz defaults to musl.
tools = { "github:rust-fuzz/cargo-fuzz" = "0.13.2" }
usage = '''
arg "[target]" help="One target under fuzz/fuzz_targets; every target when omitted"
flag "--seconds <seconds>" help="How long each target runs" default="60"
flag "--replay" help="Replay each committed corpus once instead of searching"
flag "--list" help="Print the targets, one per line, and run none"
'''
run = '''
set -eu
# Its report goes to stderr, so `--list` prints the targets alone.
rustup toolchain install "$KYNOS_NIGHTLY" --profile minimal --no-self-update >&2

if [ -n "${usage_target:-}" ]; then
  set -- "$usage_target"
else
  # An assignment carries the listing's status to `set -e`; `set --` would not.
  targets="$(cargo +"$KYNOS_NIGHTLY" fuzz list --fuzz-dir fuzz)"
  if [ -z "$targets" ]; then
    echo "cargo fuzz list found no target under fuzz/fuzz_targets" >&2
    exit 1
  fi
  set -- $targets
fi

if [ "${usage_list:-false}" = true ]; then
  printf '%s\n' "$@"
  exit 0
fi

host="$(rustc +"$KYNOS_NIGHTLY" -vV | sed -n 's/^host: //p')"
for target in "$@"; do
  if [ "${usage_replay:-false}" = true ]; then
    cargo +"$KYNOS_NIGHTLY" fuzz run --fuzz-dir fuzz --target "$host" "$target" \
      "fuzz/corpus/$target" -- -runs=0
  else
    mkdir -p "fuzz/target/corpus/$target"
    cargo +"$KYNOS_NIGHTLY" fuzz run --fuzz-dir fuzz --target "$host" "$target" \
      "fuzz/target/corpus/$target" "fuzz/corpus/$target" \
      -- -max_total_time="$usage_seconds"
  fi
done
'''

[tasks."fuzz:check"]
description = "Build every fuzz target and replay its committed corpus"
# The only build of `fuzz/`; `-runs=0` replays the committed corpus only.
run = "mise run fuzz --replay"

[tasks.check]
description = "Run formatting, linting, and tests"
# The `features:*` tasks run last: `cargo hack` rewrites member manifests while
# it works, which breaks anything sharing the workspace.
run = [
  { task = "format:check" },
  { task = "lint" },
  { task = "lint:baseline" },
  { task = "lint:codecs" },
  { task = "test" },
  { task = "test:baseline" },
  { task = "test:doc" },
  { task = "references:verify" },
  { task = "containment:check" },
  { task = "containment:test" },
  { task = "tooling:check" },
  { task = "tooling:test" },
  { task = "deny:check" },
  { task = "cost:test" },
  { task = "profile:test" },
  { task = "commits:test" },
  { task = "docs:check" },
  { task = "panic:check" },
  { task = "test:arbitrary-precision" },
  { task = "features:check" },
  { task = "features:targets" },
]

[tasks."commits:message"]
description = "Validate one Conventional Commit message from stdin"
quiet = true
# Exempts a merge as `commits:check` does, which convco's stdin mode cannot
# see. MERGE_HEAD is tested as a file, not a ref a branch could shadow, through
# `--git-path` for linked worktrees. Amending a merge is a known gap (docs/nfr.md).
run = '''
if [ -f "$(git rev-parse --git-path MERGE_HEAD)" ]; then
  exit 0
fi
convco check --from-stdin
'''

[tasks."commits:check"]
description = "Validate an explicit or outgoing commit range"
quiet = true
run = '''
if [ -n "${CONVCO_RANGE:-}" ]; then
  convco check "$CONVCO_RANGE"
elif git rev-parse --verify --quiet origin/master >/dev/null; then
  convco check origin/master..HEAD
elif git rev-parse --verify --quiet HEAD >/dev/null; then
  convco check HEAD
else
  echo "No commits to validate."
fi
'''

[tasks."commits:test"]
description = "Test that both halves of the commit rule agree about a merge"
# Two instruments state one rule and disagree silently, so each verdict is put
# to both over real repositories, including a merge through hk's hook.
tools = { python = "3.11.16" }
run = "python3 scripts/commits_test.py"

[tasks."hooks:pre-push"]
description = "Run all pre-push checks"
# The cheap gates; each `*:test` follows the gate whose instrument it tests.
run = [
  { task = "format:check" },
  { task = "lint" },
  { task = "lint:baseline" },
  { task = "lint:codecs" },
  { task = "coverage" },
  { task = "docs:check" },
  { task = "containment:check" },
  { task = "containment:test" },
  { task = "tooling:check" },
  { task = "tooling:test" },
  { task = "commits:check" },
  { task = "commits:test" },
]
